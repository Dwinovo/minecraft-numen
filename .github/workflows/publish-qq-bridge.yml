name: Publish QQ Bridge (borrowed secret)

# One-off manual publisher for the sibling repo numen-qq-mcp, living here only
# because this repo already holds the account-wide CURSEFORGE_TOKEN secret.
# Retire it once numen-qq-mcp gets its own copy of the secret — its local
# publish.yml is the long-term pipeline.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "numen-qq-mcp ref to build and publish"
        default: "v0.1.0-beta"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout numen-qq-mcp
        uses: actions/checkout@v4
        with:
          repository: Dwinovo/numen-qq-mcp
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders
        run: |
          chmod +x ./gradlew
          ./gradlew :fabric:build :neoforge:build --no-daemon

      - name: Publish Fabric to CurseForge
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          files: fabric/build/libs/numen_qq-fabric-1.21.1-0.1.0.jar
          loaders: fabric
          name: numen_qq-0.1.0-beta-fabric-1.21.1
          version: 0.1.0-beta-fabric-1.21.1
          game-versions: 1.21.1
          game-version-filter: none
          version-type: beta
          changelog: |
            First public release, 0.1.0-beta:
            - Direct-chat and group modes, with deny-by-default QQ account/group whitelists
            - Inbound messages join the companion's task queue: executed immediately when idle, queued mid-task
            - The companion replies on its own via the send_qq_message tool - private in, private out; group in, group out
            - NapCatQQ (OneBot 11) forward WebSocket with automatic reconnect
            Requires Numen 0.0.4+.
          curseforge-id: 1601064
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Publish NeoForge to CurseForge
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          files: neoforge/build/libs/numen_qq-neoforge-1.21.1-0.1.0.jar
          loaders: neoforge
          name: numen_qq-0.1.0-beta-neoforge-1.21.1
          version: 0.1.0-beta-neoforge-1.21.1
          game-versions: 1.21.1
          game-version-filter: none
          version-type: beta
          changelog: |
            First public release, 0.1.0-beta:
            - Direct-chat and group modes, with deny-by-default QQ account/group whitelists
            - Inbound messages join the companion's task queue: executed immediately when idle, queued mid-task
            - The companion replies on its own via the send_qq_message tool - private in, private out; group in, group out
            - NapCatQQ (OneBot 11) forward WebSocket with automatic reconnect
            Requires Numen 0.0.4+.
          curseforge-id: 1601064
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
