name: Modrinth Maintenance

# Manual maintenance for the Modrinth project: list all versions, or delete a
# comma-separated set of version ids. Runs with the repo's MODRINTH_TOKEN —
# the same credential the publish workflow uses.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list | delete"
        required: true
        default: "list"
      version_ids:
        description: "comma-separated Modrinth version ids (delete only)"
        required: false
        default: ""

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: List versions
        if: ${{ inputs.action == 'list' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/b1E5VR0g/version" \
            | jq -r '.[] | [.id, .version_number, (.loaders | join("/")),
                            (.game_versions | join("+")), .files[0].filename] | @tsv' \
            | sed 's/^/VERSION\t/'

      - name: Delete versions
        if: ${{ inputs.action == 'delete' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          IDS: ${{ inputs.version_ids }}
        run: |
          set -euo pipefail
          if [ -z "${IDS}" ]; then
            echo "no version_ids given" >&2
            exit 1
          fi
          IFS=',' read -ra ids <<< "${IDS}"
          for id in "${ids[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              "https://api.modrinth.com/v2/version/${id}")
            echo "DELETE ${id} -> HTTP ${code}"
            if [ "${code}" != "204" ]; then
              exit 1
            fi
          done
