# 开发期的小模组:把 GameTest 的套件入口登记给原版的 GameTest 框架(见 ForgeGameTestMod),并给模拟主人的连接配频道。
# 只在 GameTest 的运行配置里加载,不进发行 jar,不发布。夹具的 mixin 配置由运行配置的 --mixin.config 挂上。
modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "LGPL-3.0"

[[mods]]
modId = "numen_api_gametest"
version = "0"
displayName = "Numen API GameTest"
description = '''Development-only: GameTest support for Numen API and everything built on it.'''

[[dependencies.numen_api_gametest]]
modId = "numen_api"
mandatory = true
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
