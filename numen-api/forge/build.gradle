import com.dwinovo.numen.build.Modules

plugins {
    id 'numen-api-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

// 要读 Numen API 的测试夹具源码集,它得先配置好
evaluationDependsOn(':numen-api:common')

// ForgeGradle 把开发期的 Forge(版本带 _mapped_,只在本机的 FG 缓存里有)记成依赖,原样发出去第三方解析不了:
// fg.component 把它从 POM 里去掉,并且不发 Gradle 模块元数据(第三方与 fg.deobf 都按 POM 解析)。
publishing.publications.named('mavenJava', MavenPublication) { fg.component(it) }

// Forge 1.20.4 运行期是 SRG 名,而 mixin 源码按官方名写——必须生成 refmap 把
// 字符串引用翻译过去,否则运行期找不到字段直接崩。
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

/*
 * GameTest 在加载器这一层的支持(src/gametest,开发期的小模组 numen_api_gametest,不进发行 jar):把套件入口 GameTestSuites
 * 登记给原版的 GameTest 框架,和给模拟主人的连接配频道。用 Numen API 的都用得上(Numen、联动、第三方插件),所以归 Numen API;
 * 各运行配置把它和 Numen API 的测试夹具声明成模组 numen_api_gametest(见 numen/forge/build.gradle)。
 */
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true // Calls processResources when in dev

    // Automatically enable forge AccessTransformers if the file exists.
    // This location is hardcoded in Forge and can not be changed.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.numen-api.${project.name}.main"
            taskName 'Client'
        }
        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.numen-api.${project.name}.main"
            taskName 'Server'
        }
        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.numen-api.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
        }
    }
}

// 发行 jar 把纯 JVM 模块的类平铺进来(见 numen-api-loader.gradle 的 jar 块),运行时它们就是本模组的一部分。
// Forge 49 的开发运行只把"自带 META-INF/mods.toml 的类路径根"当模组,一个模组的类不在同一个根里就由应用类加载器加载
// (碰到原版类就是两份 ServerPlayer),纯 JVM 模块的 jar 又以自动模块的身份与本模组的同名包冲突、JPMS 校验拒启。
// 所以开发运行里本模组是一个 jar(devJar,内容同发行 jar,官方名),运行的类路径只有原版、Forge、库和这个 jar(源码集 devRun)。
Modules.ALL.each { evaluationDependsOn(it) }
sourceSets {
    devRun {}
}
configurations.named('devRunRuntimeOnly') {
    extendsFrom configurations.minecraft, configurations.minecraftLibrary
}
// 运行时类路径里也不放纯 JVM 模块的 jar:ForgeGradle 拿它拼原版的类路径(legacyClassPath),它们的类已在 devJar 里
configurations.named('runtimeClasspath') { config ->
    Modules.ALL.each { path -> config.exclude module: project(path).name }
}
minecraft.runs.configureEach { run ->
    run.source sourceSets.devRun
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '.cache/**'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // refmap 由 mixin 注解处理器在编译期生成——AP 必须显式挂上,否则 mixin 照样编译
    // 通过、jar 照样打出来,只是里面没有 refmap,运行期才炸。
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'

    // 聊天气泡的 Markdown 解析库(ui 模块用它)是内嵌的库,不是平铺进来的类。发行物是 Numen 的 -all,它把本模块与这个库
    // 并排嵌在 META-INF/jarjar/ 里(见 numen/forge/build.gradle);开发运行不读 jarJar,这里让它进运行类路径。mcp 产出的
    // 重定位过的 Nimbus 是一份 jar,发行 jar 平铺它的类(见 numen-api-loader.gradle),开发运行用的 devJar 也一样平铺,不另作库。
    minecraftLibrary "org.commonmark:commonmark:${commonmark_version}"
    minecraftLibrary "org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}"

    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
    devRunRuntimeOnly files({ tasks.named('devJar') })
}

processGametestResources {
    var expandProps = ['forge_loader_version_range': forge_loader_version_range]
    filesMatching('META-INF/mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar.finalizedBy('reobfJar')

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}

// ForgeGradle quirk: classes + resources share one output dir so the dev launcher and the
// mixin refmap see them together.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
// 共目录之后,跨项目 classpath 的 builtBy 只挂着 compileJava:把资源拷贝排在编译前,
// 消费方(如 :numen:forge:compileJava)拿到目录时两类内容都已就位,不再竞态。
tasks.named('compileJava') { dependsOn tasks.named('processResources') }
tasks.named('compileGametestJava') { dependsOn tasks.named('processGametestResources') }

// mixin AP 与增量编译不相容：增量轮次 AP 不重跑，refmap 丢失且 jar 静默不带，
// 生产环境 SRG 运行时 mixin 按官方名找不到目标直接拒启（开发期 disableRefMap 照不出）。
tasks.named('compileJava', JavaCompile) { options.incremental = false }
// 绞索：包里有 mixins.json 就必须有 refmap，缺了当场把构建判死，不给静默坏包出门。
tasks.named('jar', Jar) {
    doLast {
        def zf = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            boolean hasMixins = zf.entries().any { it.name.endsWith('.mixins.json') }
            boolean hasRefmap = zf.entries().any { it.name.endsWith('.refmap.json') }
            if (hasMixins && !hasRefmap) {
                throw new GradleException("mixin refmap missing from ${archiveFile.get().asFile.name}")
            }
        } finally { zf.close() }
    }
}

// 开发运行里的本模组(见上面 devRun):取 jar 的文件树而不是 with(jar) 共用它的拷贝规格——MixinGradle 的 addMixinsToJar 在执行期
// 往 jar 的规格里加输入,共用就是改了已经开始执行的任务。
def devJar = tasks.register('devJar', Zip) {
    from({ tasks.named('jar').get().source })
    archiveClassifier = 'dev'
    archiveExtension = 'jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE   // 文件树不带 jar 里的改名,几份 LICENSE 同名
    destinationDirectory = layout.buildDirectory.dir('devjars')
}
// 开发期的小模组 numen_api_gametest 同样是一个 jar:它的类与 Numen API 的测试夹具(各运行配置挂它,见 numen/forge/build.gradle)
tasks.register('gametestDevJar', Zip) {
    from sourceSets.gametest.output
    from project(':numen-api:common').sourceSets.testFixtures.output
    archiveClassifier = 'gametest-dev'
    archiveExtension = 'jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = layout.buildDirectory.dir('devjars')
}
// 运行任务在动作里才读类路径,不认上面 files(...) 带的任务依赖
tasks.matching { it.name in ['Client', 'Server', 'Data'] }.configureEach { dependsOn devJar }

