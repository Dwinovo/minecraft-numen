buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '0.1.4'
ext.numenApiVersion = '0.0.2'
group = 'com.dwinovo.numen'
base {
    archivesName = 'numen-core-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "numen_api.refmap.json"
    config "numen_api.mixins.json"
    config "numen_api.forge.mixins.json"
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'numen'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                numen {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'numen'
            mods {
                numen {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.register('syncGameTestStructures', Sync) {
    from layout.projectDirectory.dir('gameteststructures')
    into layout.projectDirectory.dir('run-gametest/gameteststructures')
}

tasks.configureEach {
    if (name == 'runGameTestServer') dependsOn tasks.named('syncGameTestStructures')
}

processResources {
    inputs.property 'numen_version', project.version
    inputs.property 'numen_api_version', numenApiVersion
    filesMatching('META-INF/mods.toml') {
        expand numen_version: project.version, numen_api_version: numenApiVersion
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
    options.compilerArgs.add('-Xlint:-deprecation')
    options.compilerArgs.add('-Xlint:-removal')
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'numen',
            'Specification-Vendor': 'dwinovo',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'dwinovo',
            'Built-On-Minecraft': '1.20.1'
        ])
    }
}
