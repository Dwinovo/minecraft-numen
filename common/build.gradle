plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

// 客户端专属源码集(issue #9):src/client/java 只被客户端消费,主源码集
// 的 classpath 上物理上没有这些类——服务端代码引用客户端类从"运行时才炸"
// 变成"import 就编译不过"。
sourceSets {
    client {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
    }
}
neoForge.addModdingDependenciesTo(sourceSets.client)

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    // 客户端 mixin 迁到 client 源码集,注解在编译它时也要在场
    clientCompileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    clientCompileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonClientJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonClientJava sourceSets.client.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        // 声线库/分句器等客户端类的 headless 测试要看得见 client 源码集
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

test {
    // Normal unit tests only — the network-hitting tool-call benchmark is tagged
    // 'bench' and excluded here so `./gradlew test` (and CI) never makes an LLM call.
    useJUnitPlatform {
        excludeTags 'bench'
    }
}

// Offline tool-call benchmark. Run with credentials in the environment:
//   NUMEN_BENCH_API_KEY=sk-... NUMEN_BENCH_MODEL=deepseek-chat \
//   NUMEN_BENCH_PROVIDER=deepseek ./gradlew :common:toolBench
// Skips cleanly (does not fail) when NUMEN_BENCH_API_KEY is unset.
tasks.register('toolBench', Test) {
    description = 'Run the offline tool-call benchmark against the configured LLM.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bench'
    }
    // Config precedence (low → high): benchmark/.env  <  .env  <  shell env var  <  -Dnumen.bench.*
    // The .env files are git-ignored, so credentials never touch the command line or VCS.
    def loadDotEnv = { File f ->
        def m = [:]
        if (f.exists()) {
            f.eachLine('UTF-8') { String line ->
                line = line.trim()
                if (line.isEmpty() || line.startsWith('#')) return
                int i = line.indexOf('=')
                if (i <= 0) return
                def key = line.substring(0, i).trim()
                def val = line.substring(i + 1).trim()
                if (val.length() >= 2 && ((val.startsWith('"') && val.endsWith('"'))
                        || (val.startsWith("'") && val.endsWith("'")))) {
                    val = val.substring(1, val.length() - 1)
                }
                if (key.startsWith('NUMEN_BENCH_')) m[key] = val
            }
        }
        return m
    }
    def fromEnvFiles = [:]
    fromEnvFiles.putAll(loadDotEnv(rootProject.file('benchmark/.env')))
    fromEnvFiles.putAll(loadDotEnv(rootProject.file('.env')))     // repo-root .env overrides benchmark/.env
    fromEnvFiles.each { k, v -> environment(k.toString(), v) }

    // Shell env vars override .env; -D system properties (read first by the bench) win overall.
    ['NUMEN_BENCH_API_KEY', 'NUMEN_BENCH_PROVIDER', 'NUMEN_BENCH_MODEL', 'NUMEN_BENCH_BASE_URL',
     'NUMEN_BENCH_SAMPLES', 'NUMEN_BENCH_TEMPERATURE', 'NUMEN_BENCH_PROXY'].each { k ->
        def val = System.getenv(k)
        if (val != null) environment(k, val)
    }
    System.properties.each { k, v ->
        if (k.toString().startsWith('numen.bench.')) systemProperty(k.toString(), v)
    }
    outputs.upToDateWhen { false }   // always re-run; it's a measurement, not a cache
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// 服务端安全门:主源码集不得引用 Minecraft 客户端类。源码集隔离挡得住
// "引用我们自己的客户端类"(classpath 上没有,import 即编译错),但挡不住
// 直接 import 原版客户端类——common 编译用的是合并的客户端 MC jar,
// net.minecraft.client 永远在场。这道检查把缺口补上:出现即 fail,
// 该代码应移入 src/client/java。
tasks.register('checkServerSafe') {
    group = 'verification'
    description = 'Fail if src/main references Minecraft client-only classes.'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            int no = 0
            f.eachLine('UTF-8') { line ->
                no++
                if (line.contains('net.minecraft.client') || line.contains('com.mojang.blaze3d')) {
                    offenders << "${f}:${no}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "src/main 引用了 Minecraft 客户端类(专用服务端上不存在,会 ClassNotFound)。\n"
                    + "把这些代码移进 src/client/java:\n  " + offenders.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkServerSafe' }
