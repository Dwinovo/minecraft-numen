# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/numen-common.gradle expandProps map.

# Project
version=0.1.5
group=com.dwinovo.numen
java_version=21

# Common
minecraft_version=1.21.4
mod_name=Numen
mod_author=dwinovo
license=LGPL-3.0-only
credits=
description=LLM-powered AI companions. Summon a companion (a server-side fake player) and just talk to it; an agent running on your own machine and your own API key plans and carries out the work: pathfinding, mining, building, combat, crafting, and container use.
minecraft_version_range=[1.21.4, 1.21.5)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.4-20241203.161809

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.117.0+1.21.4
fabric_loader_version=0.18.1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.4.123
neoforge_loader_version_range=[4,)

# Markdown in chat bubbles (ui module); shipped inside the loader jars of Numen API.
commonmark_version=0.30.1

# MCP (mcp module): the protocol is our own (JDK HTTP server and client, Gson); Nimbus for the client's OAuth,
# relocated and merged into the Numen API jars (see mcp/build.gradle, docs/adr/control/0019).
nimbus_oauth_version=11.38.2

# LLM transport uses java.net.http.HttpClient (JDK built-in, Java 11+) and
# Gson (already on the MC classpath). No third-party HTTP / SDK dependencies.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Local maven repo the api family publishes into (numen-maven, for third-party consumers).
# 制品的落点。默认是仓内的 build/local-maven —— 本地调试发到这里,
# 发出来的东西跟着 build/ 一起被 gitignore,不可能混进正式制品仓。
# CI 发正式版时用 -Plocal_maven_url= 指到 checkout 出来的 numen-maven。
local_maven_url=build/local-maven
# 本分支(1.21.4)只带目标模组在这一版有构建的联动:车万女仆、YSM、森罗物语、FTB Quests、KubeJS 都没有 1.21.4 的构建。
# Curios(饰品栏)。只接 NeoForge 版,编译只对着它的公开 API 包;见 plugins/curios。
curios_version=10.0.1+1.21.4
# Litematica 联动(Fabric 上是 Litematica,NeoForge 上是 Forgematica)。Litematica 与它的库 MaLiLib 是纯客户端模组,发布物是 Yarn 名,
# LGPL-3.0;只作编译期依赖,Loom 替本模块把它们重映射成 Mojang 名。masa 的 maven 上 1.21.4 这一条线各只有一个构建。
litematica_version=0.21.7
malilib_version=0.23.5
# JEI 联动。JEI 只在玩家的客户端上跑,联动只对着它的公共 API 编译(MIT);1.21.4 的 JEI 只有 NeoForge 构建,所以只接在 NeoForge 上。
jei_version=20.0.0.4

# Paper 端:paperweight 的开发包(Mojang 名的 Paper 服务端),与上面的 minecraft_version 同一版。
paper_dev_bundle=1.21.4-R0.1-SNAPSHOT
