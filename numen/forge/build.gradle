import com.dwinovo.numen.build.Modules

plugins {
    id 'numen-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

// 要读 Numen 的 gametest 与 testFixtures 源码集、Numen API 的开发期 gametest 源码集,它们得先配置好
evaluationDependsOn(':numen:common')
evaluationDependsOn(':numen-api:forge')
evaluationDependsOn(':mcp')

// ForgeGradle 把开发期的 Forge(版本带 _mapped_,只在本机的 FG 缓存里有)记成依赖,原样发出去第三方解析不了:
// fg.component 把它从 POM 里去掉,并且不发 Gradle 模块元数据(第三方与 fg.deobf 都按 POM 解析)。
publishing.publications.named('mavenJava', MavenPublication) { fg.component(it) }

// Forge 1.20.4 运行期是 SRG 名,而 mixin 源码按官方名写——必须生成 refmap 把
// @Accessor("nibble") 之类的字符串引用翻译过去,否则运行期找不到字段直接崩。
// (Fabric 那边由 loom 在 remapJar 期改写注解,机制不同,见 fabric/build.gradle。)
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

/*
 * GameTest:用例在 numen/common 与 numen/pathing 的 gametest 里,只用原版,经套件报到;这里只把它们的输出声明进模组 numen(见下面的
 * mods)。加载器这一层的支持(登记套件入口、模拟主人连接的频道配法)属于 Numen API,在 numen-api/forge 的开发期小模组
 * numen_api_gametest 里,这里把它声明进运行配置。用例与夹具不进发行 jar:jar 只收 main 的输出。
 */

// 这一次 GameTest 跑批带的有用例的模块,和它们的套件名(模块与套件名的对应在根 build.gradle 的 numenSuites 表里)。联动的 GameTest
// 另开一次(它们的构建脚本里),不带这两个模块的用例。
def gameTestModules = rootProject.ext.numenGameTestModules.collect { project(it) }
def gameTestSuites = gameTestModules.collect { rootProject.ext.numenSuites[it.path].gametest }
// 跑哪些套件:默认是这一次带的全部;-Pgametest=numen_pathing(逗号分隔)只跑指定的
def gameTestSelection = providers.gradleProperty('gametest').orElse(gameTestSuites.join(','))

def gameTestSeed = providers.gradleProperty('gametestSeed')
// 排查与证明稳定(见 GameTestSuites):-PgametestOnly=<全名正则> 只跑匹配的用例,-PgametestCopies=N 每条铺 N 份并行
def gameTestOnly = providers.gradleProperty('gametestOnly')
def gameTestCopies = providers.gradleProperty('gametestCopies')
// 场地起点(-PgametestOrigin=x,y,z):没给就是固定的默认一处(见 GameTestOrigin),失败日志里写着这次用的哪一处
def gameTestOrigin = providers.gradleProperty('gametestOrigin')

// GameTest 的结构模板:同步进 numen/common 的构建目录里的一处(见那边的 syncGameTestStructures),运行配置指向它。
def gameTestStructures = project(':numen:common').layout.buildDirectory.dir('gameteststructures')

// 开发运行的类路径(见下面"Forge 49 的开发运行"):端到端测试的服务端用 devRun,别的运行用 gameTestRun
sourceSets {
    devRun {}
    gameTestRun {}
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true // Calls processResources when in dev

    // Automatically enable forge AccessTransformers if the file exists.
    // This location is hardcoded in Forge and can not be changed.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.numen.${project.name}.main"
            taskName 'Client'
            property 'numen.gametest.suites', gameTestSelection.get()
        }
        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.numen.${project.name}.main"
            taskName 'Server'
        }
        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.numen.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
        }
        gameTestServer {
            workingDirectory file('runs/gametestserver')
            ideaModule "${rootProject.name}.numen.${project.name}.main"
            taskName 'runGameTestServer'
            property 'numen.gametest.suites', gameTestSelection.get()
            // 真实地形维度的种子(-PgametestSeed=…):没给就是原版 GameTest 服务器写死的 0
            if (gameTestSeed.present) {
                property 'numen.gametest.seed', gameTestSeed.get()
            }
            if (gameTestOnly.present) {
                property 'numen.gametest.only', gameTestOnly.get()
            }
            if (gameTestCopies.present) {
                property 'numen.gametest.copies', gameTestCopies.get()
            }
            if (gameTestOrigin.present) {
                property 'numen.gametest.origin', gameTestOrigin.get()
            }
            rootProject.ext.numenTerrainProperties().each { key, value -> property key, value }
        }
    }
}

minecraft.runs.configureEach { run ->
    // 所有运行配置都指向同步好的 SNBT 模板目录(见 numen/common 的 syncGameTestStructures):无头跑批用,开发客户端里
    // /test run <用例> 现场围观也用(见 GameTestSuites)。
    run.property 'numen.gametest.structures', gameTestStructures.get().asFile.absolutePath
    // 同仓的源码集在开发期是官方名,它们的 mixin 也按官方名写——不用 refmap 才对得上
    run.property 'mixin.env.disableRefMap', 'true'
    // Numen API 以同仓源码集进运行(不是带 MANIFEST 的模组 jar),它的 mixin 配置没人替它声明——发行物里由
    // Numen API jar 的 MixinConfigs 清单项接手,开发运行在这里显式挂。
    run.args '--mixin.config', 'numen_api.mixins.json'
    run.args '--mixin.config', 'numen_api.forge.mixins.json'
    // 端到端测试的服务端是玩家服务器的样子:只有 Numen 与 Numen API,GameTest 的用例、夹具与支持模组都不在里面
    boolean withGameTests = run.name != 'e2e'
    if (withGameTests) {
        run.args '--mixin.config', 'numen_api_gametest.mixins.json'
        // Forge 才要的那一处:GameTest 服务器走原版建测试世界的路(见 numen-api/forge 的 ForgeGameTestWorldMixin)
        run.args '--mixin.config', 'numen_api_gametest.forge.mixins.json'
    }
    // 每个模组在运行里是一个 jar(见下面的 devRun 与 gameTestRun)
    run.source(withGameTests ? sourceSets.gameTestRun : sourceSets.devRun)
}

/*
 * Forge 49 的开发运行只把"自带 META-INF/mods.toml 的类路径根"当模组,一个模组的类不在同一个根里就由应用类加载器加载(碰到原版类就是
 * 两份 ServerPlayer)。所以运行里每个模组是一个 jar,官方名:
 *   numen               本模组的类、平铺进发行 jar 的寻路模块(见 numen-loader.gradle),带 GameTest 的运行再加 Numen 的夹具与各模块的用例;
 *   numen_api           Numen API 的 devJar(内容同它的发行 jar,见 numen-api/forge/build.gradle);
 *   numen_api_gametest  Numen API 的 GameTest 支持:套件机制与登记入口、模拟主人连接的加载器实现,和 Numen API 的测试夹具。
 * 运行的类路径只有原版、Forge、库和这几个 jar:端到端测试的服务端是玩家服务器的样子(源码集 devRun),别的运行带着 GameTest(gameTestRun)。
 */
def numenDevJar = { String name, boolean withGameTests ->
    tasks.register(name, Zip) {
        from sourceSets.main.output
        from project(':numen:pathing').sourceSets.main.output
        if (withGameTests) {
            // Numen 的夹具:只含原版类;是联动的 GameTest 也用的那一份
            from project(':numen:common').sourceSets.testFixtures.output
            gameTestModules.each { from it.sourceSets.gametest.output }
        }
        archiveClassifier = withGameTests ? 'gametest-dev' : 'dev'
        archiveExtension = 'jar'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        destinationDirectory = layout.buildDirectory.dir('devjars')
    }
}
def numenDev = numenDevJar('devJar', false)
def numenGameTestDev = numenDevJar('gametestDevJar', true)
def apiForge = project(':numen-api:forge')
['devRunRuntimeOnly', 'gameTestRunRuntimeOnly'].each { name ->
    configurations.named(name) { extendsFrom configurations.minecraft, configurations.minecraftLibrary }
}
def apiDev = apiForge.tasks.named('devJar', Zip).flatMap { it.archiveFile }
def apiGameTestDev = apiForge.tasks.named('gametestDevJar', Zip).flatMap { it.archiveFile }
dependencies {
    devRunRuntimeOnly files(numenDev.flatMap { it.archiveFile }, apiDev)
    gameTestRunRuntimeOnly files(numenGameTestDev.flatMap { it.archiveFile }, apiDev, apiGameTestDev)
}

// 运行任务在动作里才读类路径,不认上面 files(...) 带的任务依赖
tasks.matching { it.name in ['Client', 'Server', 'Data', 'runGameTestServer'] }.configureEach {
    dependsOn ':numen:common:syncGameTestStructures'
    dependsOn numenGameTestDev, ':numen-api:forge:devJar', ':numen-api:forge:gametestDevJar'
}
tasks.matching { it.name == 'E2e' }.configureEach {
    dependsOn numenDev, ':numen-api:forge:devJar'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    // 测试服的配置目录每次开服从空的开始(世界目录由 TerrainWorld 清):上一次跑批(包括失败的一次)改过的开关、签过的皮肤缓存、
    // 发过的令牌、存下的档案不带进这一次
    doFirst {
        delete project.file('runs/gametestserver/config')
    }
}

// Package this module's own datagen output (`./gradlew :numen:forge:Data` writes it there).
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '.cache/**'

// 发行物是 jarJar 产的 -all:Numen API 与它的内嵌库(聊天气泡的 Markdown 解析库、mcp 模块的其余第三方库)并排嵌在 META-INF/jarjar/ 里。
// 内嵌库挂在这里而不是 Numen API 的 jar 里:Numen API 在 Forge 上随 Numen 发,ForgeGradle 的 jarJar 只认坐标,嵌不进别的项目的 -all。
jarJar.enable()

dependencies {
    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它们的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar。
    compileOnly project(':plugins:curios')
    compileOnly project(':plugins:ftbquests')
    compileOnly project(':plugins:jei')

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // refmap 由 mixin 注解处理器在编译期生成——AP 必须显式挂上,否则 mixin 照样编译
    // 通过、jar 照样打出来,只是里面没有 refmap,运行期才炸(与 Numen API 的 forge 模块同款声明)。
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'

    // 单元测试之外的开发运行要 Numen API 在类路径上的内嵌库(运行配置里 Numen API 是源码集,不读 jarJar)
    minecraftLibrary "org.commonmark:commonmark:${commonmark_version}"
    minecraftLibrary "org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}"
    Modules.nestedLibraries(project(':mcp')).each { coordinate ->
        minecraftLibrary(coordinate) { transitive = false }
    }
    // mcp 产出的官方 SDK 与重定位过的库平铺在 Numen API 的 jar 里,开发运行用的 devJar 也一样(见 numen-api/forge/build.gradle)

    // Numen API 在发行物里由下面的 jarJar 带进来;开发运行里是同仓的源码集(上面的 mods 块)。编译期看不见它的内部类
    // (见 numen-loader.gradle 的瘦 api jar)。transitive=false:只嵌 Numen API 的 jar,Forge/MC 依赖由加载器提供。
    jarJar(project(':numen-api:forge')) {
        transitive = false
        jarJar.ranged(it, '[0.0.0,)')
    }
    jarJar("org.commonmark:commonmark:${commonmark_version}") {
        transitive = false
        jarJar.ranged(it, "[${commonmark_version},0.31)")
    }
    jarJar("org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}") {
        transitive = false
        jarJar.ranged(it, "[${commonmark_version},0.31)")
    }
    Modules.nestedLibraries(project(':mcp')).each { coordinate ->
        def libVersion = coordinate.split(':')[2]
        jarJar(coordinate) {
            transitive = false
            jarJar.ranged(it, "[${libVersion},)")
        }
    }
}

// 跟车发的联动,它们的防漂移测试(技能与命令说明按命令树读一遍)随本模块的 check 一起跑:构建发行 jar 就查过它带上的文字
tasks.named('check') {
    dependsOn(':plugins:ftbquests:test', ':plugins:jei:test')
}

jar.finalizedBy('reobfJar')
// jarJar 打的是 :numen-api:forge 的 build/libs 产物;必须等它被 reobfJar 原地改写成 SRG 之后再打包,
// 否则嵌进去的是 official 名的 dev jar,线上加载直接崩。finalizer 不构成消费方的依赖边,这里补上。
tasks.matching { it.name == 'jarJar' }.configureEach {
    dependsOn ':numen-api:forge:reobfJar'
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}

// ForgeGradle quirk: classes + resources share one output dir so the dev launcher and the
// mixin refmap see them together.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// mixin AP 与增量编译不相容：增量轮次 AP 不重跑，refmap 丢失且 jar 静默不带，
// 生产环境 SRG 运行时 mixin 按官方名找不到目标直接拒启（开发期 disableRefMap 照不出）。
tasks.named('compileJava', JavaCompile) { options.incremental = false }
// 绞索：包里有 mixins.json 就必须有 refmap，缺了当场把构建判死，不给静默坏包出门。
tasks.named('jar', Jar) {
    doLast {
        def zf = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            boolean hasMixins = zf.entries().any { it.name.endsWith('.mixins.json') }
            boolean hasRefmap = zf.entries().any { it.name.endsWith('.refmap.json') }
            if (hasMixins && !hasRefmap) {
                throw new GradleException("mixin refmap missing from ${archiveFile.get().asFile.name}")
            }
        } finally { zf.close() }
    }
}

// 联动模组的类与资源平铺进发行 jar——它们本质是独立模组,只是跟车一起发。
// 目标模组不在时它们一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
//
// jar 和 jarJar 都要:Forge 这边真正发出去的是 jarJar 产的 -all(它把 Numen API 嵌进
// META-INF/jarjar/),而它<b>不继承 jar 的内容配置</b>。只加在 jar 上的话,-all 里
// 一个联动 class 都没有——装上去就是"工具凭空少了几个",还不报错。
tasks.matching { it.name == 'jar' || it.name == 'jarJar' }.configureEach {
    it.from({ project(':plugins:curios').sourceSets.main.output })
    it.from({ project(':plugins:ftbquests').sourceSets.main.output })
    it.from({ project(':plugins:jei').sourceSets.main.output })
}

// 联动经目标模组的类型调用原版方法:reobf 要知道那些类型的继承关系,才能把调用点的方法名翻成 SRG 名,
// 认不出来的调用点留着官方名、线上就是 NoSuchMethodError。所以把各联动的编译期类路径(目标模组的 jar 在里面)一并交给 reobf 当库。
tasks.matching { it.name == 'reobfJar' || it.name == 'reobfJarJar' }.configureEach {
    libraries.from({
        [':plugins:curios', ':plugins:ftbquests'].collect {
            project(it).configurations.compileClasspath
        }
    })
}

// 端到端测试(numen/common 的 e2e 源码集,任务 e2eTest):用原版客户端协议连一台真的专用服。
apply plugin: 'numen-e2e-forge'
