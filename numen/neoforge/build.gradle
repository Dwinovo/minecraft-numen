plugins {
    id 'numen-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    // Numen API 同在本构建里。编译期看不见它的内部类(见 numen-loader.gradle),运行与数据生成要它在类路径上,
    // 所以是 runtimeOnly:POM 里落成运行期依赖,玩家装 Numen 就带上它。
    runtimeOnly project(':numen-api:neoforge')

    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它们的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar,不作为独立依赖出现在 POM 里
    // (它们不发布——没人需要依赖我们的联动代码)。
    compileOnly project(':plugins:ysm')
    compileOnly project(':plugins:tlm')
    compileOnly project(':plugins:kaleidoscope')
    compileOnly project(':plugins:curios')
    compileOnly project(':plugins:ftbquests')
    // Bundle it into Numen's jar (Jar-in-Jar) so players install one file and get both mods.
    jarJar(project(':numen-api:neoforge'))
}

/*
 * GameTest 的用例在 src/gametest:它们拉起同伴、直接摸引擎内部(CompanionFactory、程序的回环客户端),所以要看见完整的
 * Numen API——而 main 只看得见瘦 api jar(见 numen-loader.gradle)。用例不进发行 jar:jar 只收 main 的输出。
 * 同一个模组 numen 里的另一份源码集,运行时和 main 一样加载。
 */
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
dependencies {
    gametestImplementation project(':numen-api:neoforge')
    // 套件机制(登记入口 GameTestSuites):各模块的用例都经它交给原版的 GameTest 框架,见 numen-api 的测试夹具
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
}

// GameTest 的结构模板:本模组的在 gameteststructures/,寻路模块的在它自己的 src/gametest/structures/。原版只认一个
// 模板目录,运行前把两处同步进构建目录里的一处,运行配置指向它。
def gameTestStructures = layout.buildDirectory.dir('gameteststructures')
def syncGameTestStructures = tasks.register('syncGameTestStructures', Sync) {
    from 'gameteststructures'
    from project(':numen:pathing').file('src/gametest/structures')
    into gameTestStructures
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.gametest)
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':numen:common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', "${mod_id},numen_pathing")
            // 所有运行配置都指向同步好的 SNBT 模板目录(见上面 syncGameTestStructures):无头跑批用,开发客户端里
            // /test run <用例> 现场围观也用(见 GameTestKit 静态块)。
            systemProperty('numen.gametest.structures', gameTestStructures.get().asFile.absolutePath)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            data() // NeoForge 21.1 (1.21.1) has no clientData() run type — the combined data() run + --all covers it
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = this.mkdir(this.file("runs/gametestserver"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            // 寻路模块的类平铺进发行 jar(见 numen-loader.gradle),开发期的运行不走那个 jar,在这里同样声明;
            // 另外挂它自己的 GameTest 用例
            sourceSet project(':numen:pathing').sourceSets.main
            sourceSet project(':numen:pathing').sourceSets.gametest
            // 套件机制(GameTestSuites 与套件接口):只含原版类
            sourceSet project(':numen-api:common').sourceSets.testFixtures
        }
    }
}

tasks.matching { it.name ==~ /run[A-Z].*/ }.configureEach {
    dependsOn syncGameTestStructures
    dependsOn 'gametestClasses', ':numen:pathing:gametestClasses', ':numen-api:common:testFixturesClasses'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

// 联动模组的类与资源平铺进发行 jar——它们本质是独立模组,只是跟车一起发。
// 目标模组不在时它们一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
tasks.named('jar', Jar) {
    from({ project(':plugins:ysm').sourceSets.main.output })
    from({ project(':plugins:tlm').sourceSets.main.output })
    from({ project(':plugins:kaleidoscope').sourceSets.main.output })
    from({ project(':plugins:curios').sourceSets.main.output })
    from({ project(':plugins:ftbquests').sourceSets.main.output })
}

// 跟车发的联动,它们的防漂移测试(技能与命令说明按命令树读一遍)随本模块的 check 一起跑:构建发行 jar 就查过它带上的文字
tasks.named('check') {
    dependsOn(':plugins:ysm:test', ':plugins:tlm:test', ':plugins:kaleidoscope:test', ':plugins:ftbquests:test')
}

// 真模型评测:原版的场景在 src/bench,:numen:neoforge:runBench 跑它们(见 buildSrc 的 numen-bench.gradle 与 docs/bench.md)。
// 放在末尾:它要用到上面定义好的模组 numen。
apply plugin: 'numen-bench'
