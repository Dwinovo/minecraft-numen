plugins {
    id 'numen-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Obfuscated MC (1.21.1) → loom remaps to Mojang names to match the common source set.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Numen API 同在本构建里(Loom 项目)。编译期看不见它的内部类(见 numen-loader.gradle),开发运行与数据生成要它在
    // 类路径上,所以是 runtimeOnly:POM 里落成运行期依赖。namedElements 直接给开发期(Mojang 名)的 jar,不经 maven 往返。
    runtimeOnly project(path: ':numen-api:fabric', configuration: 'namedElements')
    // Bundle it into Numen's jar (Jar-in-Jar) so players install one file and get
    // both mods — exactly like including a library mod such as GeckoLib.
    include project(':numen-api:fabric')

    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar,不作为独立依赖出现在 POM 里。
    // 只有 YSM:车万女仆没有 Fabric 版。
    compileOnly project(':plugins:ysm')
    localRuntime project(':numen:pathing')
}

loom {
    def aw = project(':numen:common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        datagen {
            inherit client
            setConfigName('Fabric Data Generation')
            ideConfigGenerated(true)
            runDir('runs/datagen')
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 联动模组的类与资源平铺进发行 jar——它本质是独立模组,只是跟车一起发。
// 平铺在 jar 这一步,随后 remapJar 把它连同本模块的类一起换成 intermediary 名:
// 联动对着原版的 Mojang 名编译,与本模块的 named 命名空间是同一套,所以能一起重映射。
// 目标模组不在时它一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
tasks.named('jar', Jar) {
    from({ project(':plugins:ysm').sourceSets.main.output })
}

// 跟车发的联动,它的防漂移测试(技能与命令说明按命令树读一遍)随本模块的 check 一起跑:构建发行 jar 就查过它带上的文字
tasks.named('check') {
    dependsOn(':plugins:ysm:test')
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
