plugins {
    id 'numen-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

// 要读 Numen API 的 apiJar 任务,它得先配置好
evaluationDependsOn(':numen-api:common')

dependencies {
    // Numen 是 Numen API 的第一个插件,和别的插件走同一扇门:编译期只看得见瘦 api jar 里公开的那部分,
    // 由编译器把关;完整的类运行时由 Numen API 这个模组提供,不随 Numen 发。ai / agent / ui 是插件经 POM 传递依赖拿到的模块。
    compileOnly files(project(':numen-api:common').tasks.named('apiJar'))
    compileOnly project(':ai')
    compileOnly project(':agent')
    compileOnly project(':ui')
    // 寻路模块(只依赖原版):Numen 的内容,发行 jar 里平铺进 Numen 的加载器 jar,见 numen-loader.gradle
    compileOnly project(':pathing')
    // 单元测试可以看完整的 Numen API(夹具要登记处、排程机器),编译与运行类路径补上同一模块。
    testImplementation project(':numen-api:common')
    testImplementation project(':pathing')

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 客户端专属源码集(寻路调试的覆盖层):src/client/java 只被客户端消费,主源码集的 classpath 上物理上没有这些类,
// 服务端代码引用客户端类在编译期就过不去。照 numen-api/common 的做法。
sourceSets {
    client {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
    }
}
neoForge.addModdingDependenciesTo(sourceSets.client)

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonClientJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonClientJava sourceSets.client.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

// 服务端安全门:Numen 的 common 主源码集全部是服务端代码(工具/任务/寻路/
// 建造),客户端半边在 src/client/java。common 编译用的是合并的客户端 MC jar,
// 手滑 import 一个 net.minecraft.client 编译器照样放行、专用服务端上
// ClassNotFound——这道检查让它在构建期就 fail。
tasks.register('checkServerSafe') {
    group = 'verification'
    description = 'Fail if src/main references Minecraft client-only classes.'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            int no = 0
            f.eachLine('UTF-8') { line ->
                no++
                if (line.contains('net.minecraft.client') || line.contains('com.mojang.blaze3d')) {
                    offenders << "${f}:${no}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "src/main 引用了 Minecraft 客户端类(专用服务端上不存在,会 ClassNotFound)。\n"
                    + "Numen 的 common 应保持纯服务端;客户端功能归 Numen API:\n  "
                    + offenders.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkServerSafe' }
