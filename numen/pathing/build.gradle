// numen-pathing:寻路模块,设计稿见 docs/pathing.md。
//
// 对着原版编译(NeoForm),不含加载器代码。它是 Numen API 的一个插件的内容(寻路),和别的插件走同一扇门:
// classpath 上只有 Minecraft 与它自带的库(fastutil、slf4j),再加 Numen API 的瘦 api jar——看得见的只有 Numen API
// 公开的那部分(键盘、物理步进、换手),不引用 Numen 与 ai / agent,边界由编译器守。
// Numen 经端口接入;成品随 Numen 的两个加载器 jar 平铺发出,见 numen-loader.gradle。
plugins {
    id 'numen-common'
    id 'net.neoforged.moddev'
}

// 要读 Numen API 的 apiJar 任务,它得先配置好(别的模块的配置会先把本模块拉起来)
evaluationDependsOn(':numen-api:common')

neoForge {
    neoFormVersion = neo_form_version
}

sourceSets {
    // 单测跑在原版环境里:引导注册表、用真实的 BlockState,所以测试的类路径就是主源码集的那一份原版。
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    // 模块自己的 GameTest:用一个不是同伴的普通假玩家真走,只看模块与原版,用例只写原版的注解。套件 numen_pathing 经
    // META-INF/services 报到,由 numen:neoforge 的 GameTest 服务器一起跑(见 numen/neoforge/build.gradle),所以不进发行 jar;
    // 模板在 src/gametest/structures。
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    // 瘦 api jar:同插件一样的一扇门
    compileOnly files(project(':numen-api:common').tasks.named('apiJar'))
    // 单测跑起来也要这扇门里的类(挖掘公式、视线几何):运行期同一个瘦 jar
    testRuntimeOnly files(project(':numen-api:common').tasks.named('apiJar'))
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // GameTest 的套件机制(原版注解之外的唯一依赖):套件接口与登记的入口,见 numen-api 的测试夹具
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
}

test {
    useJUnitPlatform()
}
