plugins {
    id 'java-library'
}

/**
 * 一个<b>联动模组</b>的构建约定。{@code plugins/} 下每个子目录是一个独立联动,
 * 被内嵌进成品 jar 一起发,但本质上就是一个独立模组。
 *
 * <h2>为什么各自一个模块,而不是一个大模块装几个包</h2>
 * 每个联动都要拉自己那个目标模组的 compileOnly 依赖和 maven 仓库。挤在一起的话,
 * 接 AE2 会让 YSM 联动的类路径上多出 AE2,接 Jade 又多一个——最后没人说得清哪个
 * 联动到底依赖了什么。一个联动一格:加一个是加一个目录,删一个是删一个目录。
 *
 * <h2>跑在什么平台上,联动自己声明</h2>
 * 只写原版 MC 与 numen api 的联动对着原版编译(VanillaGradle,与 api/common 同一条路),
 * 三个加载器都能跑,加载器各不相同的事经一个接口由宿主提供;目标模组本身只有某个
 * 加载器版的,就对着那个加载器编译(ForgeGradle)。瘦 api jar 也跟着选
 * ({@code :api:common} 或 {@code :api:forge} 的 apiJar)。两样都写在各自的 build.gradle 里,
 * 这里不替它们定——buildSrc 的预编译脚本插件也不允许带版本号 apply 那两个插件。
 *
 * <h2>为什么编译期只给瘦 api jar</h2>
 * 联动和第三方插件走同一扇门({@code NumenPlugins.register}),那就该<b>看得见的东西
 * 也一样</b>。放进 core 的话同一个 jar 里什么都看得见,今天走前门、明天赶时间抄近路,
 * 而我们发现 API 缺陷全靠有人走前门(onClient 静默空操作那个坑就是这么找到的)。
 * 这条规矩交给编译器执行,不靠自觉。
 *
 * <h2>不发布</h2>
 * 没有 maven-publish。没人需要依赖我们的联动代码,发出去只是多一个要维护的坐标。
 */
group = 'com.dwinovo.numen'
base { archivesName = "numen-plugin-${project.name}-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(java_version) }

// 源码是 UTF-8。不写死的话 Windows 上的 javac 按 GBK 读,注释里的中文直接编译报错。
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    // 复现第三方插件的类路径:ai / ui 是他们经 POM 传递依赖拿到的两个模块
    // (NumenTool 继承的 IToolSpec 在 ai 里)。瘦 api jar 由联动按平台自己挑,见上。
    // 别图省事换成 project(':api:forge'):那样整个引擎的内部类都进类路径,这个模块就白设了。
    compileOnly project(':ai')
    compileOnly project(':ui')
}
