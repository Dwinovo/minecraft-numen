plugins {
    id 'java-library'
}

// ForgeGradle 由各模块自己带版本号 apply —— buildSrc 的预编译脚本插件不允许写 version,
// 而 ForgeGradle 没有进 buildSrc 的依赖,id 在这里解析不到。

/**
 * 一个<b>联动模组</b>的构建约定(Forge 版)。{@code plugins/} 下每个子目录是一个独立联动,
 * 被内嵌进成品 jar 一起发,但本质上就是一个独立模组。
 *
 * <h2>为什么各自一个模块</h2>
 * 每个联动都要拉自己那个目标模组的 compileOnly 依赖和 maven 仓库。挤在一起的话,
 * 接一个新的会让别的联动类路径上多出东西,最后没人说得清哪个联动依赖了什么。
 *
 * <h2>为什么编译期只给瘦 api jar</h2>
 * 联动和第三方插件走同一扇门({@code NumenPlugins.register}),那就该<b>看得见的东西
 * 也一样</b>。放进 core 的话同一个 jar 里什么都看得见,今天走前门、明天赶时间抄近路,
 * 而我们发现 API 缺陷全靠有人走前门。这条规矩交给编译器执行,不靠自觉。
 *
 * <h2>不发布</h2>
 * 没有 maven-publish。没人需要依赖我们的联动代码。
 */
group = 'com.dwinovo.numen'
base { archivesName = "numen-plugin-${project.name}-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(java_version) }

// 源码是 UTF-8。不写死的话 Windows 上的 javac 按 GBK 读,注释里的中文直接编译报错。
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    // 复现第三方插件的类路径,一点不多一点不少:瘦 api jar + ai/ui(NumenTool 继承的
    // IToolSpec 在 ai 里)。别换成 project(':api:forge'),那样引擎内部类都进来了。
    compileOnly files(project(':api:forge').tasks.named('apiJar'))
    compileOnly project(':ai')
    compileOnly project(':ui')
}
