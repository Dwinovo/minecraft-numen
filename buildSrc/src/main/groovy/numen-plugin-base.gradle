import com.dwinovo.numen.build.Modules

plugins {
    id 'java-library'
}

/**
 * 一个<b>联动模组</b>的构建约定里,不分加载器的那一半。{@code plugins/} 下每个子目录是一个独立联动,
 * 被内嵌进成品 jar 一起发,但本质上就是一个独立模组。
 *
 * <p>这一半不碰编译用的 MC 从哪来,那由联动在自己的 build.gradle 里选的构建插件定:VanillaGradle(对着原版编译)、
 * ForgeGradle(目标模组只有 Forge 版)或 Fabric 的 Loom(目标模组只有 Fabric 版)。buildSrc 的预编译脚本插件不能带版本号
 * 应用那几个插件,所以各联动自己写。几条路共有的是下面这些:坐标与产物名、Java 版本、编译期看得见的模块、体检测试、
 * 不发布。
 *
 * <h2>为什么各自一个模块,而不是一个大模块装几个包</h2>
 * 每个联动都要拉自己那个目标模组的 compileOnly 依赖和 maven 仓库。挤在一起的话,
 * 接 AE2 会让 YSM 联动的类路径上多出 AE2,接 Jade 又多一个——最后没人说得清哪个
 * 联动到底依赖了什么。一个联动一格:加一个是加一个目录,删一个是删一个目录。
 *
 * <h2>跑在什么平台上,联动自己声明</h2>
 * 只写原版 MC 与 Numen API 的联动对着原版编译(VanillaGradle),
 * 三个加载器都能跑,加载器各不相同的事经一个接口由宿主提供;目标模组本身只有某个
 * 加载器版的,就对着那个加载器编译(Forge 版用 ForgeGradle,Fabric 版用 Loom)。瘦 api jar 也
 * 跟着选({@code :numen-api:common} 或 {@code :numen-api:<loader>} 的 apiJar)。两样都写在各自的
 * build.gradle 里,这里不替它们定。
 *
 * <h2>为什么编译期只给瘦 api jar</h2>
 * 联动和第三方插件走同一扇门({@code NumenPlugins.register}),那就该<b>看得见的东西
 * 也一样</b>。放进 Numen 的话同一个 jar 里什么都看得见,今天走前门、明天赶时间抄近路,
 * 而我们发现 API 缺陷全靠有人走前门(onClient 静默空操作那个坑就是这么找到的)。
 * 这条规矩交给编译器执行,不靠自觉。
 *
 * <h2>不发布</h2>
 * 没有 maven-publish。没人需要依赖我们的联动代码,发出去只是多一个要维护的坐标。
 */
group = 'com.dwinovo.numen'
base { archivesName = "numen-plugin-${project.name}-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(java_version) }

dependencies {
    // 复现第三方插件的类路径:ai / script / agent / permission / ui 是他们经 POM 传递依赖拿到的模块
    // (NumenTool 继承的 IToolSpec 在 ai 里)。瘦 api jar 由联动按平台自己挑,见上。
    // 别图省事换成 project(':numen-api:<loader>'):那样整个 Numen API 的内部类都进类路径,这个模块就白设了。
    Modules.PLUGIN_VISIBLE.each { compileOnly project(it) }
}

/*
 * API 体检报告:联动登记的函数与技能里写着的每一行调用,经 ApiTester.lint 查一遍,写进 build/reports(Numen 的
 * ApiLintReport),不拦构建;Gradle 任务 apiLintReport,不是测试。
 *
 * 报告跑在 Numen 单测的原版环境里,不跑在本模块的加载器环境里:Forge 打过补丁的 MC 离了 FML 引导不起来
 * (Bootstrap 要 Forge 的事件总线),而体检只要原版、Numen 登记的函数与联动自己的登记代码。目标模组不在场,
 * 也不需要在场——它不经 Builtin 的闸门、不假装模组已装,只执行联动登记函数的那一段(同一个 install,经同一扇
 * NumenPlugins 的门),那一段只碰 Numen API。联动的组只进它自己这个进程,不混进 Numen 的单测。
 */
def numenTests = { project(':numen:common').sourceSets.test }
sourceSets.test {
    compileClasspath += files({ numenTests().output }) + files({ numenTests().compileClasspath })
    // 原版的类放在最前:联动自己的类路径上(ForgeGradle 的 minecraft 依赖)那份带补丁的 MC 排在原版后面,只供编译期引用的联动类型用
    runtimeClasspath = files({ numenTests().output }) + files({ numenTests().runtimeClasspath }) + runtimeClasspath
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// 报告的入口是联动包里的 ApiLint(没有就不登记,如 curios);任务定义见 numen-api-lint
if (file("src/test/java/com/dwinovo/numen/plugins/${project.name}/ApiLint.java").exists()) {
    pluginManager.apply('numen-api-lint')
    tasks.named('apiLintReport') { mainClass = "com.dwinovo.numen.plugins.${project.name}.ApiLint" }
}
