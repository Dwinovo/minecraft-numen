plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Javadoc comments here are written for source readers; strict doclint
// (HTML-escaping every & and <, mandatory @param) fights that without
// adding value to a mod jar. Standard practice: turn it off.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

// Source files contain UTF-8 (CJK comments/strings). Pin the compiler charset so the build
// doesn't depend on the JDK/OS default — without this, a non-UTF-8 platform default (e.g. GBK on
// Chinese Windows) misreads sources as "illegal character" errors.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Retain parameter names in bytecode so the @NumenAction tool layer can
    // derive an argument's name from the method signature (reflection on
    // Parameter.getName()), instead of forcing every @Arg to repeat the name.
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// 协议文本随 jar 发出:根目录的 LICENSE(LGPL-3.0),licenses/ 下 LGPL 所依托的 GPL 全文与美术资源的授权;
// jar 里沿用 LICENSE、COPYING、LICENSE-ASSETS 这三个惯用名,后缀是所属模组的 id
def licenseTexts = copySpec {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
    from(rootProject.file('licenses/GPL-3.0.txt')) { rename { "COPYING_${mod_id}" } }
    from(rootProject.file('licenses/ASSETS.txt')) { rename { "LICENSE-ASSETS_${mod_id}" } }
}

sourcesJar {
    with licenseTexts
}

jar {
    with licenseTexts

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

// Slim "api" jar (classifier 'api'): only the public-API packages — the surface
// tool packs build against — with the @Internal stragglers that live inside them
// excluded. Addon devs compileOnly this small, stable jar; the full jar runs at
// runtime. Mirrors Flywheel's flywheel-…-api, Create's :slim, and JEI's …-api.
//
// 它是从**成品 jar** 里裁出来的,不是从编译产物。Fabric 的运行期命名是
// intermediary,成品由 Loom 的 remapJar 换过去;若这里改从 sourceSets 取,瘦 jar
// 就停在 mojmap,同一个 publication 里两套命名——用 yarn 的插件作者会在
// ServerPlayer 这种名字上直接编译失败。裁成品则两者永远同源,不可能分叉。
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    // 谁是成品:Fabric 是 remapJar,其余加载器就是 jar 本身。loader 插件在子项目的
    // plugins 块里晚于本脚本应用,所以推迟到执行期再问。
    def shippedJar = { tasks.findByName('remapJar') ?: tasks.getByName('jar') }
    dependsOn shippedJar
    from({ zipTree(shippedJar().archiveFile) })
    // common 自己的成品 jar 不含 client 源码集,而公共 API 有两个门住在那里
    // (NumenGateway/NumenActuator)。加载器模块把 common 的两个源码集都并进了
    // 成品,这里取到空集,不会引入第二套映射。
    from({ def c = sourceSets.findByName('client'); c != null ? c.output : [] })
    // public API surface (see the package-info of each). This list is the
    // contract of record — kept in lockstep with what Numen actually
    // compiles against, so building Numen against the :api jar always works.
    // com.dwinovo.numen.api 这一包里属于公共 API 的类:@Internal 标记与 API 门面。同包里还住着引擎自己的入口
    // (CommonClass、Constants 与各加载器的模组入口),所以逐个点名,不整包放行
    include 'com/dwinovo/numen/api/CompanionEvent*.class'
    include 'com/dwinovo/numen/api/CompanionPortrait*.class'
    include 'com/dwinovo/numen/api/Delivery*.class'
    include 'com/dwinovo/numen/api/Internal*.class'
    include 'com/dwinovo/numen/api/NumenActuator*.class'
    include 'com/dwinovo/numen/api/NumenApi*.class'
    include 'com/dwinovo/numen/api/NumenGateway*.class'
    include 'com/dwinovo/numen/api/NumenPlugin*.class'  // NumenPlugin 与 NumenPlugins
    include 'com/dwinovo/numen/api/gear/**'
    include 'com/dwinovo/numen/api/NumenPaths*.class'  // config/numen/ 的唯一答案(NumenApi.configDir 背后那个)
    include 'com/dwinovo/numen/api/agent/tool/api/**'  // per-call tool context
    include 'com/dwinovo/numen/api/agent/tool/**'      // tool contract + registration + Schema/ToolArgs
    include 'com/dwinovo/numen/api/area/**'            // 一块地方(格、团、区域)——API 函数的值类型,Lua 值转换也认它
    include 'com/dwinovo/numen/api/task/**'            // task contract + the registration points a pack drives
    include 'com/dwinovo/numen/api/sdk/**'             // API 函数的写法:@Fn、值转换、调用的原语——插件经 NumenApi.api 登记
    include 'com/dwinovo/numen/api/permission/**'      // 唯一判定"身体可不可以动世界"的地方 —— 插件自己的任务同样得过它
    include 'com/dwinovo/numen/api/entity/NumenPlayer*.class'   // the body a tool acts on
    include 'com/dwinovo/numen/api/entity/InputDriver*.class'   // ...its own facing, looking and boat steering
    include 'com/dwinovo/numen/api/entity/BodyDelta*.class'     // what an action changed on the body: carried items, health, riding, broken gear
    include 'com/dwinovo/numen/api/entity/Belongings*.class'    // ...and the carried-items/experience snapshot it is made of
    include 'com/dwinovo/numen/api/entity/Controls*.class'      // 她缺的那半个客户端:键盘、
    include 'com/dwinovo/numen/api/entity/Physics*.class'       // 每刻的物理步进、
    include 'com/dwinovo/numen/api/entity/Hotbar*.class'        // 换手(数字键/中键/F 键),
    include 'com/dwinovo/numen/api/entity/BodyAction*.class'    // 以及换手留下的记录——自己写寻路的插件按它们让她走
    include 'com/dwinovo/numen/api/entity/DigTime*.class'       // 原版的挖掘时间与缓手,
    include 'com/dwinovo/numen/api/entity/Reach*.class'         // 够得着、
    include 'com/dwinovo/numen/api/entity/Sight*.class'         // 看得见、
    include 'com/dwinovo/numen/api/entity/Faces*.class'         // 点得中哪一面、
    include 'com/dwinovo/numen/api/entity/Replaceable*.class'   // 放下去落在哪一格——身体与寻路规划共用的那一组原版事实
    include 'com/dwinovo/numen/api/entity/package-info.class'
    include 'com/dwinovo/numen/api/agent/skill/SkillRegistry*.class' // ship-skills-with-your-jar entry
    include 'com/dwinovo/numen/api/agent/skill/SkillInfo*.class'
    include 'com/dwinovo/numen/api/platform/Services*.class'          // cross-loader SPI locator
    include 'com/dwinovo/numen/api/platform/ServerLifecycle*.class'   // 世界作用域的状态在关服时作废:持有者自己在静态块里报到
    include 'com/dwinovo/numen/api/platform/services/**'              // (block caps for storage inspection)
    // Loom 只给"认得出是 mod"的 jar 做重映射,判据就是 fabric.mod.json。瘦 jar 不带
    // 它,消费者的 modCompileOnly 会原样透传:jar 里是 intermediary、消费者环境里是
    // yarn,撞在 class_3222 找不到上。无条件写——其余加载器的成品 jar 里没有这个
    // 文件(它们用 META-INF/neoforge.mods.toml),匹配不到就是空操作。这样不必认识
    // 任何 loom 插件 id:各分支上它叫 fabric-loom / fabric-loom-remap /
    // net.fabricmc.fabric-loom 三种名字,盯 id 必然漏。
    include 'fabric.mod.json'
    // 协议文本随成品 jar 进来(见上面 jar 块),瘦 jar 发给第三方开发者,一样要带
    include 'LICENSE*'
    include 'COPYING*'
    // drop the @Internal stragglers sitting inside those API packages
    exclude 'com/dwinovo/numen/api/agent/tool/ToolInvocation*.class'
    exclude 'com/dwinovo/numen/api/agent/tool/ClientToolContext*.class'
    // API 的派发与程序的执行:引擎内部,插件只写函数
    exclude 'com/dwinovo/numen/api/sdk/Dispatcher*.class'
    exclude 'com/dwinovo/numen/api/sdk/Consents*.class'
    // scheduler internals: implementation of the task machine, not its contract
    exclude 'com/dwinovo/numen/api/task/TaskQueue*.class'
    exclude 'com/dwinovo/numen/api/task/UnsupportedCompanionTask*.class'
    exclude 'com/dwinovo/numen/api/task/CompanionBrain*.class'
    exclude 'com/dwinovo/numen/api/task/ChainScheduler*.class'
    exclude 'com/dwinovo/numen/api/task/LlmTaskChain*.class'
    exclude 'com/dwinovo/numen/api/task/TaskSessionHooks*.class'
    exclude 'com/dwinovo/numen/api/task/HandPinRelease*.class'
    exclude 'com/dwinovo/numen/api/task/chain/**'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // Distinct coordinates from Numen (which keeps "numen-…"), so Numen can
            // depend on the published api as a separate artifact.
            // groupId 显式钉死:项目内部 group 为避免与 Numen 同名模块冲突已改为
            // com.dwinovo.numen.api,但对外发布坐标是既有契约,保持不变。
            groupId = 'com.dwinovo.numen'
            artifactId = "numen-api-${project.name}-${minecraft_version}"
            from components.java
            artifact apiJar   // the slim :api classifier — addon devs compileOnly this
        }
    }
    repositories {
        maven {
            name = 'localNumen'
            // 发布目标的唯一出处是 gradle.properties 的 local_maven_url;
            // CI 用 -Plocal_maven_url= 指到 checkout 出来的 numen-maven。
            // 这里不写兜底默认值:属性缺了就当场报错,好过静默发到别处。
            url = rootProject.uri(providers.gradleProperty('local_maven_url').get())
        }
    }
}
