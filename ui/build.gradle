// numen-ui:游戏内 UI 组件库,纯 JVM——零 Minecraft 依赖、零 numen-api 回引。
// 三层架构的中间层:上面是每版本 ~60 行的画布适配器(IDrawSurface 实现,住在
// 各版本分支里),下面是屏幕组装层(允许 import MC)。本模块与 Minecraft 版本
// 无关:十一个版本分支共用同一份 numen-ui,改一处全家族生效。
//
// 现住户:令牌(NumenTheme 色彩 / NumenStyle 几何与动效)、画布契约 IDrawSurface、
// 键码常量 KeyCodes(GLFW 数值,不 import GLFW)、缓动 Animation、排版 TextWrap、
// 控件树 widget(UiRoot 焦点与浮层通道 + 十余个控件)。
//
// 纪律:本模块的 classpath 里没有 Minecraft——"零 MC import"由编译器保证,
// 不再靠自觉。宿主能力(剪贴板/时间/翻译文本/主题色)一律由组装层注入。
plugins {
    id 'java-library'
    id 'maven-publish'
}

// 版本号不在这里出现:全树锁步,唯一出处是 gradle.properties 的 version。
group = 'com.dwinovo.numen'

// 可复现构建:同一份源码重复构建应得到同样的字节,这样重新发布是空提交,
// 不会在制品仓里堆出一串"只有时间戳不同"的版本。去掉时间戳、固定条目顺序即可。
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

base {
    archivesName = 'numen-ui'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
    // 低版本分支(1.20.1 一代)跑 Java 17:按 17 编译,21 独有的 API(Math.clamp 等)
    // 在这里就会编译失败,漂移不到消费端才发现。
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 带 MC 版本后缀,理由不是"依赖 Minecraft"(本模块零 MC 依赖),而是各版本
            // 分支上的这份源码并不相同:功能先落 1.21.1,其余分支等迁移。不带后缀
            // 就是十三条分支抢同一个坐标、谁最后发谁赢——消费者拿到哪份全看运气。
            // 等各分支的这个模块真同步齐了,再谈合并坐标。
            artifactId = "numen-ui-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localNumen'
            // 发布目标的唯一出处是 gradle.properties 的 local_maven_url;
            // CI 用 -Plocal_maven_url= 指到 checkout 出来的 numen-maven。
            // 这里不写兜底默认值:属性缺了就当场报错,好过静默发到别处。
            url = uri(providers.gradleProperty('local_maven_url').get())
        }
    }
}
