pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'Numen'
// 三兄弟布局:core/(模组本体)、api/(引擎,曾是独立仓)、ai/(LLM 连接层,纯 JVM)。
// 单一构建:core 直接以 project 依赖消费 api,api 消费 agent,agent 消费 ai,不经 maven 中转。
include('core:common')
include('core:fabric')
include('core:neoforge')
include('api:common')
include('api:fabric')
include('api:neoforge')
// numen-ai:LLM 连接层,纯 JVM、与 MC 版本无关(详见 ai/build.gradle 头注)。
include('ai')
// numen-agent:大脑本身(队列、目标),纯 JVM,依赖 ai、被 api 依赖(详见 agent/build.gradle 头注)。
include('agent')
include('ui')
// numen-lua:沙箱里的 Lua 5.2,纯 JVM,不依赖 Minecraft 与 Numen(详见 lua/build.gradle 头注与 lua/README.md)。
include('lua')
// numen-pathing:寻路,只依赖原版 Minecraft,Numen 经端口接入(详见 pathing/build.gradle 头注)。
include('pathing')

// numen-bench:真模型评测(docs/bench.md)。:bench 是纯 JVM 的记录与统计,:bench:game 是游戏里那一半;都不发布、不进发行 jar。
include('bench')
include('bench:game')

// 联动模块:一个联动一个,各自独立,内嵌发布不单独发坐标。见 buildSrc 的 numen-plugin.gradle
include('plugins:ysm')
include('plugins:tlm')
include('plugins:kaleidoscope')
include('plugins:curios')
include('plugins:ftbquests')
