// numen-mcp:MCP 的服务端与客户端,纯 JVM 库——零 Minecraft 依赖、零 Numen API 回引,不认识同伴、大脑、游戏。
// 协议这一层全用官方的实现:服务端是官方 Java SDK 的 Streamable HTTP 传输挂在内嵌的 Tomcat 上,客户端是官方 SDK 的客户端;
// OAuth(只在客户端一侧,接入要登录的 MCP 服务器时用)的通用部分用 Nimbus,MCP 特有的几步(资源元数据发现、客户端注册的
// 优先顺序、按 issuer 分开存凭据)自己写在这里。为什么这样选见 docs/adr。
//
// 它只认抽象接口:服务端问宿主"有哪些工具、调一次给什么正文、要问人时交给谁"(见 server 包),客户端把对方的工具交给宿主、
// 把令牌存进宿主给的口。Numen API 实现这些接口。
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java-library'
    id 'maven-publish'
}

// 版本号不在这里出现:全树锁步,唯一出处是 gradle.properties 的 version。
group = 'com.dwinovo.numen'

// 可复现构建:同一份源码重复构建应得到同样的字节,这样重新发布是空提交,
// 不会在制品仓里堆出一串"只有时间戳不同"的版本。去掉时间戳、固定条目顺序即可。
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

base {
    archivesName = 'numen-mcp'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
}

dependencies {
    // 落盘的基础件(令牌库、审计日志):api 让消费方透视得到 Io 等类型。
    api project(':store')
    api 'org.slf4j:slf4j-api:2.0.9'
    api 'com.google.code.gson:gson:2.10.1'
    // 官方 MCP Java SDK(规范 2025-11-25,旧版客户端它自己协商)经下面的 relocatedSdk 交给编译与运行,不直接依赖。
    // 服务端的 HTTP:SDK 的 Streamable HTTP 传输是个 Servlet,挂在内嵌 Tomcat 上(SDK 自己的测试也这样用)。
    implementation "org.apache.tomcat.embed:tomcat-embed-core:${tomcat_version}"
    // OAuth 通用部分(PKCE、令牌端点、元数据、动态注册、JWT/issuer 校验)。
    // asm(json-smart 的传递依赖)也是游戏自带的,带进来会和加载器的 asm 在模块层里撞名。
    implementation("com.nimbusds:oauth2-oidc-sdk:${nimbus_oauth_version}") { exclude group: 'org.slf4j'; exclude group: 'org.ow2.asm' }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/*
 * 官方 MCP Java SDK 的 JSON 走 Jackson 3(tools.jackson.*),Jackson 3 的注解仍是 2.x 的 com.fasterxml.jackson.annotation(要 2.20 以上)。
 * 这两个包和别人带的 Jackson 2 是同一套名字:Minecraft 1.21.2 起客户端自带 Jackson 2.13.4(而且钉死版本),整合包里别的模组
 * 嵌套带 jackson-annotations 2.x 也很常见。同名的包只会有一份赢,输的一方缺类缺方法。
 *
 * 所以 SDK 与它用 Jackson 的那几件(Jackson 3、注解、YAML 数据格式、JSON Schema 校验)打成一份 jar,Jackson 3 与注解两个包
 * 重定位到 com.dwinovo.numen.mcp.shaded 下,SDK 等的类里对它们的引用一起改写。编译与运行都用这一份(下面的 api files),
 * 两个加载器把它的类平铺进 Numen API 的发行 jar(见 numen-api-loader.gradle)。
 * SDK 剩下的依赖(Reactor、时间格式、snakeyaml-engine)不碰 Jackson,照常按坐标传递,由各平台嵌套或平铺(Modules.nestedLibraries)。
 * slf4j 由游戏(Minecraft 钉死在 2.0.9)提供:SDK 子树里声明的更新版本不带进来,免得和游戏钉的版本打架。
 */
configurations {
    mcpSdk {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    mcpSdk("io.modelcontextprotocol.sdk:mcp:${mcp_sdk_version}") { exclude group: 'org.slf4j' }
}
// 进重定位那份 jar 的模块:SDK 自己,和引用 Jackson 的
def relocatedModule = { String group ->
    group in ['io.modelcontextprotocol.sdk', 'tools.jackson.core', 'tools.jackson.dataformat', 'com.fasterxml.jackson.core', 'com.networknt']
}
def relocatedSdk = tasks.register('relocatedSdk', ShadowJar) {
    archiveClassifier = 'sdk'
    configurations = [project.configurations.mcpSdk]
    dependencies {
        exclude { !relocatedModule(it.moduleGroup) }
    }
    relocate 'tools.jackson', 'com.dwinovo.numen.mcp.shaded.tools.jackson'
    relocate 'com.fasterxml.jackson.annotation', 'com.dwinovo.numen.mcp.shaded.com.fasterxml.jackson.annotation'
    mergeServiceFiles()
    // 各库自己的模块描述符、清单与签名不进来:合成的这份不是它们中的任何一个
    exclude 'module-info.class', 'META-INF/versions/*/module-info.class', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA',
            'META-INF/maven/**'
}
dependencies {
    api files(relocatedSdk)
    configurations.mcpSdk.resolvedConfiguration.resolvedArtifacts
            .findAll { !relocatedModule(it.moduleVersion.id.group) }
            .each { a -> api("${a.moduleVersion.id.group}:${a.name}:${a.moduleVersion.id.version}") { transitive = false } }
}
// 平台把这份 jar 的类平铺进发行 jar,从这里取
ext.relocatedSdk = relocatedSdk

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 带 MC 版本后缀,理由同 ai/build.gradle:本模块零 MC 依赖,但各版本分支上的
            // 这份源码并不相同,不带后缀就是十三条分支抢同一个坐标、谁最后发谁赢。
            artifactId = "numen-mcp-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localNumen'
            // 发布目标的唯一出处是 gradle.properties 的 local_maven_url;
            // CI 用 -Plocal_maven_url= 指到 checkout 出来的 numen-maven。
            // 这里不写兜底默认值:属性缺了就当场报错,好过静默发到别处。
            url = rootProject.uri(providers.gradleProperty('local_maven_url').get())
        }
    }
}
