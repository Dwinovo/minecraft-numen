// numen-script:她写的一段程序——语言接口(ScriptEngine)、一次运行的回执(ScriptRun/ScriptCall/Stderr)、API 调用的答复与错误
// (ApiReply/ApiError/ErrorKind)、函数说明(FunctionDoc/ScriptCatalog)、资源上限(ScriptLimits),以及 Lua 的适配(script.lua)。
// 纯 JVM 库——零 Minecraft 依赖、零 Numen API 回引。只往下依赖 numen-lua(沙箱)与 numen-ai(工具结果的成败判据 ToolOutcome);
// 不许依赖 agent:agent 反过来依赖它(循环里的 Program 把程序跑成一次次调用)。
// 被 agent、Numen API、Numen、插件与评测使用。依赖方向由编译器保证,不靠自觉。
// 代码与 Minecraft 版本无关,但各版本分支上的这份源码目前并不相同,所以发布坐标带分支后缀,见下方 artifactId。
//
// 现住户:script(程序与回执的类型)、script.lua(LuaEngine:把 ScriptEngine 落到 numen-lua 上)。
plugins {
    id 'java-library'
    id 'maven-publish'
}

// 版本号不在这里出现:全树锁步,唯一出处是 gradle.properties 的 version。
group = 'com.dwinovo.numen'

// 可复现构建:同一份源码重复构建应得到同样的字节,这样重新发布是空提交,
// 不会在制品仓里堆出一串"只有时间戳不同"的版本。去掉时间戳、固定条目顺序即可。
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

base {
    archivesName = 'numen-script'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
}

dependencies {
    // 工具结果的成败判据在 ai。api 配置让本模块的消费方透视得到 ai 的类型。
    api project(':ai')
    // 脚本的语言是 Lua,跑在本仓自己维护的沙箱里(numen-lua,以 LuaJ 为底)。只在 script.lua 用,对外的类型里不出现它,
    // 所以是 implementation;发行 jar 由 numen-api-loader.gradle 平铺它的类,和本模块一样。
    implementation project(':lua')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 带 MC 版本后缀,理由同 ai/build.gradle:本模块零 MC 依赖,但各版本分支上的
            // 这份源码并不相同,不带后缀就是十三条分支抢同一个坐标、谁最后发谁赢。
            artifactId = "numen-script-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localNumen'
            // 发布目标的唯一出处是 gradle.properties 的 local_maven_url;
            // CI 用 -Plocal_maven_url= 指到 checkout 出来的 numen-maven。
            // 这里不写兜底默认值:属性缺了就当场报错,好过静默发到别处。
            url = rootProject.uri(providers.gradleProperty('local_maven_url').get())
        }
    }
}
