plugins {
    id 'net.minecraftforge.gradle'
    id 'numen-plugin-base'
}

// 只接 Forge:本联动直接订阅 FTB Quests / FTB Teams 的 Architectury 事件、读它们的队伍与进度,
// 编译对着 Forge 那份。
minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    // FTB 全家与 Architectury 各自只从自己的仓库取,按组限定。
    // 不用 exclusiveContent:ForgeGradle 的 fg.deobf 从项目的仓库列表里找原件,认不得那一层包装
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

// FTB 全家是 All Rights Reserved:只在编译期引用,运行时由玩家自己装的那份提供,
// 本模块不携带、不复制它们一个字节。Architectury 是 FTB 的事件总线所在。
def ftb = ["dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}",
           "dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}",
           "dev.ftb.mods:ftb-library-forge:${ftb_library_version}",
           "dev.architectury:architectury-forge:${architectury_version}"]


// 要读 Numen API 的 apiJar 任务,它得先配置好
evaluationDependsOn(':numen-api:forge')
// 用例要读本体与测试夹具的源码集,它们也得先配置好
evaluationDependsOn(':numen:forge')
evaluationDependsOn(':numen:common')
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 瘦 api jar 取 Forge 那份:本联动本来就只跑在 Forge 上
    compileOnly files(project(':numen-api:forge').tasks.named('apiJar'))
    // 不取它们的传递依赖(JEI、Patchouli 之类):只对着本联动用到的那几个类编译
    ftb.each { compileOnly(it) { transitive = false } }
}

/*
 * FTB Quests 在场时的 GameTest:用例在 src/gametest,单开一次跑批 `./gradlew :plugins:ftbquests:runGameTestServer`。
 *
 * 跑的是专用服务器:FTB 把只在客户端有的方法(标题、图标)标了 OnlyIn,Forge 在专用服务器上把它们删掉,
 * 联动在服务端调到它们就是 NoSuchMethodError——开发环境客户端与服务端同进程、方法还在,别的测试碰不到。
 * 只有挂着真 FTB 的专用服务器跑批能暴露这一类。
 *
 * 不挂进 Numen 那一次(:numen:forge:runGameTestServer):FTB 带着 mixin 与自己的队伍系统,挂上去全部用例的环境都跟着变。
 * 这一次照成品拼(见 buildSrc 的 numen-plugin-gametest-forge):本体、这个联动、联动的用例同在 numen 这一个模组里,FTB 全家由运行时
 * 类路径带进来,和玩家装它们一样被当成模组加载(开发环境里要先翻成官方名,所以走 fg.deobf)。任务书(config/ftbquests)在运行目录的
 * config 里,每次开服跟着整个配置目录清掉,用例从空书开始。
 *
 * 用例和 Numen 的 GameTest 共用件(GameTestKit)同包,所以用例编译对着 Numen 的测试夹具;套件是 numen_ftbquests
 * (见 FtbQuestsGameTestSuite)。
 */
sourceSets {
    gametest {}
}

configurations {
    gametestCompileOnly.extendsFrom compileOnly
    // 原版与 Forge(ForgeGradle 的 minecraft 依赖落在 implementation 上)
    gametestImplementation.extendsFrom implementation
}

dependencies {
    gametestCompileOnly files({ project(':numen:forge').sourceSets.main.output })
    gametestCompileOnly project(':numen:common').sourceSets.testFixtures.output
    // 套件接口:本联动的用例经它报到(numen_ftbquests)
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
    // 用例直接读联动里包内的类(任务书的样子),不绕客户端
    gametestCompileOnly sourceSets.main.output
    // 整个 Numen API(不是瘦 api jar):用例拉起同伴、调工具,和 Numen 的用例一样
    gametestCompileOnly project(':numen-api:forge')
    // 运行时类路径(跑批的服务器用它,防漂移测试也用它:登记 ftbquests 组时,动作的处理函数要连上 FTB 的类,只加载、不运行)。
    // 同样不进任何产物
    ftb.each { runtimeOnly(fg.deobf(it)) { transitive = false } }
}

tasks.named('compileGametestJava') {
    dependsOn ':numen:forge:classes', ':numen:common:testFixturesClasses'
}

ext.pluginGameTest = [sources: [sourceSets.main, sourceSets.gametest], mixins: []]
apply plugin: 'numen-plugin-gametest-forge'
