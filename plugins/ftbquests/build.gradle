plugins { id 'numen-plugin' }

// 只接 NeoForge:本联动直接订阅 FTB Quests / FTB Teams 自己的事件、读它们的队伍与进度,
// 编译对着 NeoForge 那份。
neoForge { version = neoforge_version }

repositories {
    // FTB 全家只从自己的仓库取,这个仓库也截不走别的坐标
    exclusiveContent {
        forRepository { maven { name = 'FTB'; url = 'https://maven.ftb.dev/releases' } }
        filter { includeGroup 'dev.ftb.mods' }
    }
}

// FTB 全家是 All Rights Reserved:只在编译期引用,运行时由玩家自己装的那份提供,
// 本模块不携带、不复制它们一个字节。
def ftb = ["dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}",
           "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}",
           "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"]

dependencies {
    // 瘦 api jar 取 NeoForge 那份:本联动本来就只跑在 NeoForge 上
    compileOnly files(rootProject.project(':numen-api:neoforge').tasks.named('apiJar'))
    ftb.each { compileOnly it }
    // 防漂移测试登记 ftbquests 组时,动作的处理函数(读任务书的 ClientBook 等)要连上 FTB 的类:只加载、不运行,
    // 同样不进任何产物
    ftb.each { testRuntimeOnly it }
}

/*
 * FTB Quests 在场时的 GameTest:用例在 src/gametest,单开一次跑批 `./gradlew :plugins:ftbquests:runGameTestServer`。
 *
 * 不挂进 Numen 那一次(:numen:neoforge:runGameTestServer):FTB 带着 mixin 与自己的队伍系统,挂上去全部用例的环境都跟着变。
 * 这一次照成品拼:本体、这个联动(成品 jar 里它本来就平铺在本体里)、联动的用例同在 numen 这一个模组里,FTB 全家由运行时类路径
 * 带进来,和玩家装它们一样被当成模组加载。跑的是专用服务器,FTB 里只在客户端有的方法在这里不存在。
 *
 * 用例和 Numen 的 GameTest 共用件(GameTestKit)同包,所以用例编译对着 Numen 的测试夹具;套件是 numen_ftbquests
 * (见 FtbQuestsGameTestSuite)。结构模板用 Numen 同步好的那一份目录。
 */
sourceSets {
    gametest {}
}

def numenNeoForge = project(':numen:neoforge')
def gameTestStructures = project(':numen:common').layout.buildDirectory.dir('gameteststructures')
def ftbqSuite = rootProject.ext.numenSuites[project.path].gametest

neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    mods {
        numen {
            sourceSet numenNeoForge.sourceSets.main
            sourceSet project(':numen:common').sourceSets.testFixtures
            // 寻路模块的类在成品里平铺在本体的 jar 里;这里不走 jar,同样声明
            sourceSet project(':numen:pathing').sourceSets.main
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
        // Numen API 的 GameTest 支持:套件机制与登记入口、模拟主人连接的加载器实现
        numen_api_gametest {
            sourceSet project(':numen-api:neoforge').sourceSets.gametest
            sourceSet project(':numen-api:common').sourceSets.testFixtures
        }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            ideName = "NeoForge GameTestServer (${project.path})"
            sourceSet = sourceSets.gametest
            gameDirectory = project.mkdir(project.file('runs/gametestserver'))
            systemProperties.put('numen.gametest.suites', providers.gradleProperty('gametest').orElse(ftbqSuite))
            systemProperty('neoforge.enabledGameTestNamespaces', 'numen_ftbquests')
            systemProperty('numen.gametest.structures', gameTestStructures.get().asFile.absolutePath)
        }
    }
}

dependencies {
    gametestCompileOnly files({ numenNeoForge.sourceSets.main.output })
    gametestCompileOnly rootProject.project(':numen:common').sourceSets.testFixtures.output
    // 套件接口:本联动的用例经它报到(numen_ftbquests)
    gametestCompileOnly rootProject.project(':numen-api:common').sourceSets.testFixtures.output
    // 用例直接读联动里包内的类(任务书的样子),不绕客户端
    gametestCompileOnly sourceSets.main.output
    // 整个 Numen API(不是瘦 api jar):用例拉起同伴、调工具,和 Numen 的用例一样;运行时它就是 numen_api 那个模组
    gametestImplementation project(':numen-api:neoforge')
    ftb.each { gametestImplementation(it) { transitive = false } }
    // 任务书的数据是 JSON5(FTB Library 内嵌的 json5-java,运行时由它提供):用例搭任务书要写它
    gametestCompileOnly 'de.marhali:json5-java:3.0.0'
}

tasks.named('compileGametestJava') {
    dependsOn ':numen:neoforge:classes', ':numen:common:testFixturesClasses'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn ':numen:neoforge:classes', ':numen-api:neoforge:gametestClasses', ':numen:common:syncGameTestStructures',
            ':numen:common:testFixturesClasses', ':numen-api:common:testFixturesClasses'
    // 测试服的配置目录每次开服从空的开始(世界目录由 TerrainWorld 清):上一次跑批(包括失败的一次)改过的开关、签过的皮肤缓存、
    // 发过的令牌、存下的档案不带进这一次。
    // 任务书(config/ftbquests)也在里面:上一次跑批存下的章节不留到这一次,用例从空书开始
    doFirst {
        delete project.file('runs/gametestserver/config')
    }
}