plugins {
    id 'numen-plugin-base'
    id 'net.fabricmc.fabric-loom'
}

// Litematica 与 MaLiLib 是 Fabric 模组,用 Loom 编译。26.1+ 的 Fabric 原生就是 Mojang 名,它们的发布物与 Numen 本体同命名,
// 普通的 compileOnly 即可,编译出来的类原样平铺进 Numen 的 Fabric 与 NeoForge 成品。
// 1.21.1 的 NeoForge 只有非官方移植 Forgematica,这个联动不接(调研见任务报告)。
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 瘦 api jar 取跨加载器那份(Mojang 名),与 plugins/ysm 一样
    compileOnly files(project(':numen-api:common').tasks.named('apiJar'))
}

repositories {
    // Litematica 与 MaLiLib 只从 masa 的 maven(sakura-ryoko 维护的这条线)取
    exclusiveContent {
        forRepository { maven { name = 'Masa'; url = 'https://masa.dy.fi/maven/sakura-ryoko' } }
        filter { includeGroupAndSubgroups 'fi.dy.masa' }
    }
}

// Litematica 是 LGPL-3.0:只在编译期引用,运行时由玩家自己装的那份提供,本模块不携带它们一个字节。
// 不要传递依赖:它们的 pom 把 fabric-loader 与 MaLiLib 写成运行期依赖,编译不需要。
dependencies {
    compileOnly("fi.dy.masa.malilib:malilib-fabric-${minecraft_version}:${malilib_version}") { transitive = false }
    compileOnly("fi.dy.masa.litematica:litematica-fabric-${minecraft_version}:${litematica_version}") { transitive = false }
}
