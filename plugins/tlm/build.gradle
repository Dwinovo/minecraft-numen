plugins { id 'numen-plugin' }

// 车万女仆只有 Forge / NeoForge 版,本联动直接用 NeoForge 的事件(玩家渲染、客户端 tick),
// 编译对着 NeoForge。Fabric 上装不上车万女仆,那边没有这个联动,也不需要有。
neoForge { version = neoforge_version }

repositories {
    // 车万女仆发在 Modrinth;代码部分 MIT,不混淆,所以可以直接编译依赖拿真模型对象。
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // 瘦 api jar 取 NeoForge 那份:本联动本来就只跑在 NeoForge 上
    compileOnly files(project(':numen-api:neoforge').tasks.named('apiJar'))
    // 运行时由玩家自己装的那份提供;本模块不携带它一个字节,也不带任何模型/贴图/音频。
    compileOnly "maven.modrinth:touhou-little-maid:${tlm_version}"
}

/*
 * 车万女仆在场时的 GameTest:用例在 src/gametest,单开一次跑批 `./gradlew :plugins:tlm:runGameTestServer`。
 *
 * 不挂进 Numen 那一次(:numen:neoforge:runGameTestServer):车万女仆带着一堆 mixin,挂上去全部用例的环境都跟着变,那一次测的
 * 就不再是"只有本体"的样子。这一次照成品拼:本体、这个联动(成品 jar 里它本来就平铺在本体里)、联动的用例同在 numen 这一个
 * 模组里,车万女仆由运行时类路径带进来,和玩家装它一样被当成模组加载。
 *
 * 用例和 Numen 的 GameTest 共用件(GameTestKit、Steps)同包,在同一个模组里才看得见包内的那些,所以用例编译对着 Numen 的
 * 测试夹具(numen/common 的 src/testFixtures)的输出;Numen 自己的用例与寻路的用例不加载。
 * 它们是套件 numen_tlm(见 TlmGameTestSuite);Numen 与寻路的用例不在这一次的类路径上,所以只跑这一个套件。
 * 结构模板用 Numen 同步好的那一份目录。
 */
sourceSets {
    gametest {}
}

// 在 runs 块外取:块里的 project(…) 是运行配置自己的"依赖某个项目",不是那个项目
def numenNeoForge = project(':numen:neoforge')
def gameTestStructures = project(':numen:common').layout.buildDirectory.dir('gameteststructures')
def tlmSuite = rootProject.ext.numenSuites[project.path].gametest

neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    mods {
        numen {
            sourceSet numenNeoForge.sourceSets.main
            // 登记套件入口与模拟连接配法的那一个源码集(加载器这一层只做这个)
            sourceSet numenNeoForge.sourceSets.gametest
            sourceSet project(':numen:common').sourceSets.testFixtures
            sourceSet project(':numen-api:common').sourceSets.testFixtures
            // 寻路模块的类在成品里平铺在本体的 jar 里;这里不走 jar,同样声明
            sourceSet project(':numen:pathing').sourceSets.main
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            ideName = "NeoForge GameTestServer (${project.path})"
            sourceSet = sourceSets.gametest
            gameDirectory = project.mkdir(project.file('runs/gametestserver'))
            // 跑哪些套件:默认是 numenSuites 表里本模块的套件;-Pgametest=…(逗号分隔)覆盖
            systemProperties.put('numen.gametest.suites', providers.gradleProperty('gametest').orElse(tlmSuite))
            // 车万女仆自带一条它自己的 GameTest(它的 @GameTestHolder),第三方模组的用例不归我们跑:NeoForge 的命名空间过滤只放行 numen_tlm
            systemProperty('neoforge.enabledGameTestNamespaces', 'numen_tlm')
            systemProperty('numen.gametest.structures',
                    gameTestStructures.get().asFile.absolutePath)
        }
    }
}

dependencies {
    gametestCompileOnly files({ numenNeoForge.sourceSets.main.output })
    gametestCompileOnly project(':numen:common').sourceSets.testFixtures.output
    // 套件接口:本联动的用例经它报到(numen_tlm)
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
    // 用例直接读她身上的外观附件(Outfit),不绕客户端
    gametestCompileOnly sourceSets.main.output
    // 整个 Numen API(不是瘦 api jar):用例拉起同伴、按模型的样子调工具,和 Numen 的用例一样;运行时它就是 numen_api 那个模组
    gametestImplementation project(':numen-api:neoforge')
    gametestImplementation "maven.modrinth:touhou-little-maid:${tlm_version}"
}

tasks.named('compileGametestJava') {
    dependsOn ':numen:neoforge:classes', ':numen:common:testFixturesClasses'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn ':numen:neoforge:classes', ':numen:neoforge:gametestClasses', ':numen:common:syncGameTestStructures',
            ':numen:common:testFixturesClasses', ':numen-api:common:testFixturesClasses'
}

/*
 * 车万女仆的评测场景:src/bench,挂着车万女仆单开一次 `./gradlew :plugins:tlm:runBench`(见 buildSrc 的 numen-bench.gradle
 * 与 docs/bench.md)。和上面的 GameTest 同一个理由不挂进原版那一次。场景要车万女仆的类,运行时它由类路径带进来。
 */
apply plugin: 'numen-bench'

dependencies {
    benchImplementation "maven.modrinth:touhou-little-maid:${tlm_version}"
}
