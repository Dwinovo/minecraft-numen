plugins {
    id 'net.minecraftforge.gradle'
    id 'numen-plugin-base'
}

// 车万女仆在这个 MC 版本上只有 Forge 版,本联动直接用 Forge 的事件(玩家渲染、客户端 tick)、能力与频道,
// 编译对着 Forge。Fabric 上装不上车万女仆,那边没有这个联动,也不需要有。
minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    // 车万女仆发在 Modrinth;代码部分 MIT,不混淆类名,所以可以直接编译依赖拿真模型对象。
    // 不用 exclusiveContent:ForgeGradle 的 fg.deobf 从项目的仓库列表里找原件,认不得那一层包装
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}


// 要读 Numen API 的 apiJar 任务,它得先配置好
evaluationDependsOn(':numen-api:forge')
// 用例要读本体与测试夹具的源码集,它们也得先配置好
evaluationDependsOn(':numen:forge')
evaluationDependsOn(':numen:common')
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 瘦 api jar 取 Forge 那份:本联动本来就只跑在 Forge 上
    compileOnly files(project(':numen-api:forge').tasks.named('apiJar'))
    // 运行时由玩家自己装的那份提供;本模块不携带它一个字节,也不带任何模型/贴图/音频。
    compileOnly "maven.modrinth:touhou-little-maid:${tlm_version}"
}

/*
 * 车万女仆在场时的 GameTest:用例在 src/gametest,单开一次跑批 `./gradlew :plugins:tlm:runGameTestServer`。
 *
 * 不挂进 Numen 那一次(:numen:forge:runGameTestServer):车万女仆带着一堆 mixin,挂上去全部用例的环境都跟着变,那一次测的
 * 就不再是"只有本体"的样子。这一次照成品拼(见 buildSrc 的 numen-plugin-gametest-forge):本体、这个联动、联动的用例同在 numen
 * 这一个模组里,车万女仆由运行时类路径带进来,和玩家装它一样被当成模组加载(开发环境里要先翻成官方名,所以走 fg.deobf)。
 *
 * 用例和 Numen 的 GameTest 共用件(GameTestKit、Steps)同包,在同一个模组里才看得见包内的那些,所以用例编译对着 Numen 的
 * 测试夹具(numen/common 的 src/testFixtures)的输出。它们是套件 numen_tlm(见 TlmGameTestSuite)。
 */
sourceSets {
    gametest {}
}

configurations {
    gametestCompileOnly.extendsFrom compileOnly
    // 原版与 Forge(ForgeGradle 的 minecraft 依赖落在 implementation 上)
    gametestImplementation.extendsFrom implementation
}

dependencies {
    gametestCompileOnly files({ project(':numen:forge').sourceSets.main.output })
    gametestCompileOnly project(':numen:common').sourceSets.testFixtures.output
    // 套件接口:本联动的用例经它报到(numen_tlm)
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
    // 用例直接读她身上的外观(Outfit),不绕客户端
    gametestCompileOnly sourceSets.main.output
    // 整个 Numen API(不是瘦 api jar):用例拉起同伴、按模型的样子调工具,和 Numen 的用例一样
    gametestCompileOnly project(':numen-api:forge')
    // 跑批的运行时类路径取主源码集那一份
    runtimeOnly fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")
}

tasks.named('compileGametestJava') {
    dependsOn ':numen:forge:classes', ':numen:common:testFixturesClasses'
}

ext.pluginGameTest = [sources: [sourceSets.main, sourceSets.gametest], mixins: ['numen_tlm.mixins.json']]
apply plugin: 'numen-plugin-gametest-forge'
