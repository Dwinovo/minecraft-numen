plugins { id 'numen-plugin' }

// 只写原版 MC、Numen API 与 JEI 的公共 API,NeoForge 与 Fabric 都能跑:编译对着原版(NeoForm),加载器的类物理上不在类路径上。
// 加载器各不相同的那一件事(流体的数量)经 JeiHost 由宿主提供。
neoForge { neoFormVersion = neo_form_version }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' } }
        filter { includeGroup 'mezz.jei' }
    }
}

dependencies {
    // 瘦 api jar 取跨加载器那份:与本模块一样只有原版 MC 的类型
    compileOnly files(project(':numen-api:common').tasks.named('apiJar'))
    // 只对着 JEI 的公共 API 编译;运行时由玩家自己装的那份提供,本模块不携带它一个字节(JEI 是 MIT)。
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}
