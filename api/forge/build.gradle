plugins {
    id 'api-loader'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

// Forge 1.20.4 运行期是 SRG 名,而 mixin 源码按官方名写——必须生成 refmap 把
// 字符串引用翻译过去,否则运行期找不到字段直接崩。
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true // Calls processResources when in dev

    // Automatically enable forge AccessTransformers if the file exists.
    // This location is hardcoded in Forge and can not be changed.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.api.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
        }
        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.api.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
        }
        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.api.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // refmap 由 mixin 注解处理器在编译期生成——AP 必须显式挂上,否则 mixin 照样编译
    // 通过、jar 照样打出来,只是里面没有 refmap,运行期才炸。
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'
    // common uses MixinExtras; Forge bundles it at runtime, but the dev compile needs it on classpath.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'
}

jar.finalizedBy('reobfJar')

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}

// ForgeGradle quirk: classes + resources share one output dir so the dev launcher and the
// mixin refmap see them together.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
// 共目录之后,跨项目 classpath 的 builtBy 只挂着 compileJava:把资源拷贝排在编译前,
// 消费方(如 :core:forge:compileJava)拿到目录时两类内容都已就位,不再竞态。
tasks.named('compileJava') { dependsOn tasks.named('processResources') }

// Forge 49 起 dev 运行的 classpath 上不许有兄弟模块的 jar:见 gradle/forge-run-classpath.gradle
apply from: rootProject.file('gradle/forge-run-classpath.gradle')

// core 的开发运行用的 api 模组:内容与发行 jar 相同(api 自己的类加上平铺进来的兄弟模块,official 名,未经 reobf)。
// Forge 49 的 dev 运行只把"自带 mods.toml 的类路径条目"当模组,目录之外的兄弟模块由应用类加载器加载,
// 它们与 api 的类共用 gson 等原版自带的库时就是 LinkageError;打成一个 jar,api 与兄弟模块同处游戏层。
// (取 jar 的文件树而不是 with(jar) 共用它的拷贝规格:MixinGradle 的 addMixinsToJar 在执行期往 jar 的规格里加输入,共用就是改了
// 已经开始执行的任务。)
tasks.register('devJar', Zip) {
    from({ tasks.named('jar').get().source })
    archiveClassifier = 'dev'
    archiveExtension = 'jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE   // 文件树不带 jar 里的改名,几份 LICENSE 同名
    destinationDirectory = layout.buildDirectory.dir('devjars')
}

// mixin AP 与增量编译不相容：增量轮次 AP 不重跑，refmap 丢失且 jar 静默不带，
// 生产环境 SRG 运行时 mixin 按官方名找不到目标直接拒启（开发期 disableRefMap 照不出）。
tasks.named("compileJava", JavaCompile) { options.incremental = false }
// 绞索：包里有 mixins.json 就必须有 refmap，缺了当场把构建判死，不给静默坏包出门。
tasks.named("jar", Jar) {
    doLast {
        def zf = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            boolean hasMixins = zf.entries().any { it.name.endsWith(".mixins.json") }
            boolean hasRefmap = zf.entries().any { it.name.endsWith(".refmap.json") }
            if (hasMixins && !hasRefmap) {
                throw new GradleException("mixin refmap missing from ${archiveFile.get().asFile.name}")
            }
        } finally { zf.close() }
    }
}
