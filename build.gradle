plugins {
    // see https://fabricmc.net/develop/ for new versions
    // 26.1+ MC is Mojang-mapped natively → plain loom (the -remap variant is the
    // obfuscated-MC path used on 1.21.x). Same 1.14.x line.
    id 'net.fabricmc.fabric-loom' version '1.14.10' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// mod_id 因家族而异(core=numen,api=numen_api),不能放全树共享的 gradle.properties,
// 在此按家族显式指定。
//
// 版本号<b>不在这里出现</b>:全树锁步,唯一出处是 gradle.properties 的 version,
// 各模块继承它。api 曾经走自己的版本线,代价是没人答得上"哪个 api 配哪个模组"——
// 得有张兼容表,而那张表不存在。锁步之后这个问题不成立:模组 0.1.3 就配 api 0.1.3。
allprojects { ext.mod_id = 'numen' }
['api:common', 'api:fabric', 'api:neoforge'].each { path ->
    project(path) {
        ext.mod_id = 'numen_api'
        // 内部模块身份必须与 core 家族区分:两家子项目同名(common/fabric/neoforge),
        // 若 group 也相同,Gradle 会把 project(':api:common') 依赖按"同一模块"做版本
        // 冲突解析,直接指回 core 自己形成任务自环。发布坐标不受影响——api-common.gradle
        // 的 publication 显式写 groupId。
        group = 'com.dwinovo.numen.api'
    }
}

// 本分支的第二个 loader。Fabric 每条分支都有,另一个是 NeoForge 还是 Forge 由分支决定,
// 下面三个入口都按它挑。<b>CI 只认这几个任务名</b>,不做探测:同一个判断写两遍,
// 迟早只改对一遍。
def secondLoader = findProject(':core:neoforge') != null ? 'neoforge' : 'forge'

/** 数据生成的统一入口。 */
tasks.register('datagenAll') {
    group = 'build'
    description = '跑齐 api 与 core 两家、本分支两个 loader 的数据生成'
    ['api', 'core'].each { family ->
        dependsOn ":${family}:fabric:runDatagen"
        // NeoForge 是 moddev 的 runData,Forge 是 ForgeGradle 的 Data
        dependsOn ":${family}:${secondLoader}:${secondLoader == 'neoforge' ? 'runData' : 'Data'}"
    }
}

/** 发布制品的统一入口:api 与 core 两家、本分支两个 loader,外加 ai/ui。 */
tasks.register('publishAll') {
    group = 'publishing'
    description = '把 api 与 core 两家、本分支两个 loader 的制品发到 local_maven_url'
    // ai/ui 也带分支后缀:代码与 MC 版本无关,但各分支上的这份源码目前不同,
    // 共用坐标会变成十三条分支互相覆盖(详见 ai/build.gradle 的 artifactId)。
    dependsOn ':ai:publish'
    dependsOn ':ui:publish'
    ['api', 'core'].each { family ->
        ['common', 'fabric', secondLoader].each { dependsOn ":${family}:${it}:publish" }
    }
}

/**
 * 发给玩家的 jar,一个 loader 一个,收进 build/release/<loader>/。发布流水线只从这里拿:
 * build/libs 里还躺着 sources、javadoc,Forge 另有一个没内嵌引擎的瘦 jar,哪个是成品只有构建知道。
 */
tasks.register('releaseJars', Sync) {
    group = 'build'
    description = '把本分支每个 loader 发给玩家的那个 jar 收进 build/release/<loader>/'
    into layout.buildDirectory.dir('release')
    // 成品出自哪个任务:Loom 要重映射时是 remapJar(26.1+ 原生 Mojang 名,没有这一步,就是 jar);
    // moddev 把内嵌的引擎直接打进 jar;ForgeGradle 的 jarJar 另出一个 -all,内嵌引擎的是它。
    def shipped = [
        fabric  : { p -> p.tasks.findByName('remapJar') ?: p.tasks.getByName('jar') },
        neoforge: { p -> p.tasks.getByName('jar') },
        forge   : { p -> p.tasks.getByName('jarJar') },
    ]
    ['fabric', secondLoader].each { loader ->
        from({ shipped[loader](project(":core:${loader}")) }) { into loader }
    }
}
