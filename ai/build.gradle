// numen-ai:大脑与 LLM 服务商之间的连接层,纯 JVM 库——零 Minecraft 依赖、
// 零 Numen API 回引。代码本身与 Minecraft 版本无关,但各版本分支上的这份源码
// 目前并不相同(功能先落 1.21.1),所以发布坐标带分支后缀,见下方 artifactId。
//
// 现住户:agent.http(传输:SSE 流式/重试退避/空闲看门狗)、agent.prompt(提示词)、
// agent.provider(线格式适配 + 兼容项 + IToolSpec 工具描述面)、agent.catalog(型号目录:models.dev 快照/缓存,
// 缓存文件落点与代理由宿主传入)、agent.llm(客户端/端点解析/会话状态/会话日志)。
plugins {
    id 'java-library'
    id 'maven-publish'
}

// 版本号不在这里出现:全树锁步,唯一出处是 gradle.properties 的 version。
group = 'com.dwinovo.numen'

// 可复现构建:同一份源码重复构建应得到同样的字节,这样重新发布是空提交,
// 不会在制品仓里堆出一串"只有时间戳不同"的版本。去掉时间戳、固定条目顺序即可。
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

base {
    archivesName = 'numen-ai'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
}

dependencies {
    // 与 MC 1.21.1 运行时同版:游戏进程里由平台提供,发布 pom 里如实声明。
    api 'com.google.code.gson:gson:2.10.1'
    api 'org.slf4j:slf4j-api:2.0.9'
    // 落盘的基础件(日志、小文档):会话日志与目录缓存只保留各自的记录格式。api 配置让 agent 与 Numen API 透视得到。
    api project(':store')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// 手动更新随包的 models.dev 快照:联网拉 api.json、裁剪、写回资源文件,更新后自己提交。
// 普通构建不联网。需要代理时 -PmodelsProxy=127.0.0.1:7890。
tasks.register('updateModelsSnapshot', JavaExec) {
    group = 'numen'
    description = 'Fetch models.dev and rewrite src/main/resources/numen_models_snapshot.json'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dwinovo.numen.api.agent.catalog.SnapshotUpdate'
    args = [file('src/main/resources/numen_models_snapshot.json').absolutePath,
            providers.gradleProperty('modelsProxy').getOrElse('')]
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 带 MC 版本后缀,理由不是"依赖 Minecraft"(本模块零 MC 依赖),而是各版本
            // 分支上的这份源码并不相同:功能先落 1.21.1,其余分支等迁移。不带后缀
            // 就是十三条分支抢同一个坐标、谁最后发谁赢——消费者拿到哪份全看运气。
            // 等各分支的这个模块真同步齐了,再谈合并坐标。
            artifactId = "numen-ai-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localNumen'
            // 发布目标的唯一出处是 gradle.properties 的 local_maven_url;
            // CI 用 -Plocal_maven_url= 指到 checkout 出来的 numen-maven。
            // 这里不写兜底默认值:属性缺了就当场报错,好过静默发到别处。
            url = rootProject.uri(providers.gradleProperty('local_maven_url').get())
        }
    }
}
