plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

// Forge 1.20.2 运行期是 SRG 名,而 mixin 源码按官方名写——必须生成 refmap 把
// @Accessor("nibble") 之类的字符串引用翻译过去,否则运行期找不到字段直接崩。
// (Fabric 那边由 loom 在 remapJar 期改写注解,机制不同,见 fabric/build.gradle。)
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

// GameTest 的结构模板:本模组的在 gameteststructures/,寻路模块的在它自己的 src/gametest/structures/。原版只认一个
// 模板目录,运行前把两处同步进构建目录里的一处,运行配置指向它。
def gameTestStructures = layout.buildDirectory.dir('gameteststructures')
def syncGameTestStructures = tasks.register('syncGameTestStructures', Sync) {
    from 'gameteststructures'
    from project(':pathing').file('src/gametest/structures')
    into gameTestStructures
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true // Calls processResources when in dev

    // Automatically enable forge AccessTransformers if the file exists.
    // This location is hardcoded in Forge and can not be changed.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.core.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun { source sourceSets.main }
                modClientApiRun {
                    source project(':api:forge').sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
            // See the data run: the api mod's SRG refmap vs. official-named runtime.
            property 'mixin.env.disableRefMap', 'true'
        }
        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.core.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun { source sourceSets.main }
                modServerApiRun {
                    source project(':api:forge').sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
            property 'mixin.env.disableRefMap', 'true'
        }
        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.core.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun { source sourceSets.main }
                modDataApiRun {
                    source project(':api:forge').sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
            // In-repo sibling projects are official-named in dev, and their mixin sources
            // are written against official names too — skipping the refmap makes them apply.
            property 'mixin.env.disableRefMap', 'true'
        }
        gameTestServer {
            workingDirectory file('runs/gametestserver')
            ideaModule "${rootProject.name}.core.${project.name}.main"
            taskName 'GameTestServer'
            mods {
                modGameTestServerRun {
                    source sourceSets.main
                    // 寻路模块本身随 numen-api 来(api 依赖它);这里只挂它自己的 GameTest 用例
                    source project(':pathing').sourceSets.gametest
                }
                modGameTestServerApiRun {
                    source project(':api:forge').sourceSets.main
                    source project(':ai').sourceSets.main
                    source project(':agent').sourceSets.main
                    source project(':lua').sourceSets.main
                    source project(':ui').sourceSets.main
                    source project(':pathing').sourceSets.main
                }
            }
            property 'mixin.env.disableRefMap', 'true'
            // 不设 forge.enabledGameTestNamespaces:Forge 48 起拿它去按"批次名前缀"筛用例,而我们的批次名不带前缀
            // (用例类标 @GameTestDontPrefix,让 @BeforeBatch 的批次名与用例的批次名一致);登记进来的本来就只有
            // 带 @GameTestHolder 的我们自己的类。
            // 给场地围上屏障,照高版本原版的样子:寻路用例把场地当孤岛(见 StructureFenceMixin)
            args '--mixin.config', 'numen_gametest.mixins.json'
            // 模板喂进存档 generated 目录的开闸口令(见 CompanionGameTests 静态块):
            // 只有无头跑批需要——IDE 运行走 testStructuresDir 那个来源。
            property 'numen.gametest.generated', 'world/generated/numen/structures'
        }
    }
}

// 所有运行配置都指向同步好的 SNBT 模板目录(见上面 syncGameTestStructures):无头跑批用,开发客户端里
// /test run <用例> 现场围观也用(见 GameTestKit 静态块)。本代无头跑批的模板另由静态块转成 NBT 喂进存档
// generated 目录(见上面 numen.gametest.generated)——"测试模板目录"这个来源只在 IS_RUNNING_IN_IDE 为真时才登记。
minecraft.runs.configureEach {
    property 'numen.gametest.structures', gameTestStructures.get().asFile.absolutePath
    // api 以同仓源码集进运行(不是带 MANIFEST 的 mod jar),它的 mixin 配置没人替它
    // 声明——发行物里由 api jar 的 MixinConfigs 清单项接手,开发运行在这里显式挂。
    args '--mixin.config', 'numen_api.mixins.json'
    args '--mixin.config', 'numen_api.forge.mixins.json'
}

tasks.matching { it.name in ['Client', 'Server', 'Data', 'GameTestServer'] }.configureEach {
    dependsOn syncGameTestStructures
}
// ForgeGradle 在本项目里按名字找运行配置里每个源码集的 classes 任务;寻路模块的 gametest 源码集不在本项目,
// 这里放一个同名的替身,指向真的那一个。
tasks.register('gametestClasses') { dependsOn ':pathing:gametestClasses' }

// 跑批世界配成超平坦、每次从头生成:见 gradle/gametest-flat-world.gradle
apply from: rootProject.file('gradle/gametest-flat-world.gradle')

// Package this module's own datagen output (`./gradlew :core:forge:Data` writes it there).
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '.cache/**'

// Bundle numen-api into core's Forge jar (Jar-in-Jar).
jarJar.enable()

dependencies {
    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它们的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar。
    compileOnly project(':plugins:ysm')
    compileOnly project(':plugins:curios')

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // refmap 由 mixin 注解处理器在编译期生成——AP 必须显式挂上,否则 mixin 照样编译
    // 通过、jar 照样打出来,只是里面没有 refmap,运行期才炸(与 api 的 forge 模块同款声明)。
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'
    // common 用到 MixinExtras;Forge 运行期自带,dev 编译期需要在 classpath 上。
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'
    // The numen-api engine, now a sibling ForgeGradle project in this build (same official
    // mappings in dev). compileOnly: the api classes are provided at runtime by the bundled
    // numen-api mod (the runs above load it from the sibling source sets).
    // compileOnlyApi 而非 api:同样让引擎进 POM 的 compile scope(消费者要扩展
    // core,编译期必须看得见 TaskRecord/Task/NumenPlayer),但**不进本模块的
    // 运行时类路径**——进去的话 :core:forge:Data 会去应用引擎的 mixin,而开发态
    // 类没有 refMap、SRG 名对不上,datagen 当场炸(试过,报 @Shadow method m_6688_
    // 未在目标类中找到)。真运行时由 jarJar 把重映射过的引擎带进来。
    // fabric/neoforge 的 datagen 需求相反,那边用 api,见各自 build.gradle。
    compileOnlyApi project(':api:forge')
    // Bundle the Forge build of the api into META-INF/jarjar/ so one file ships both mods.
    // transitive=false: only the api jar is nested — its Forge/Minecraft deps are provided
    // by the loader at runtime and must NOT be embedded (that would bloat the jar to ~94MB).
    jarJar(project(':api:forge')) {
        transitive = false
        jarJar.ranged(it, '[0.0.0,)')
    }
}

// 跟车发的联动,它们的防漂移测试(技能与命令说明按命令树读一遍)随本模块的 check 一起跑:构建发行 jar 就查过它带上的文字
tasks.named('check') {
    dependsOn(':plugins:ysm:test')
}

jar.finalizedBy('reobfJar')
// jarJar 打的是 :api:forge 的 build/libs 产物;必须等它被 reobfJar 原地改写成 SRG 之后再打包,
// 否则嵌进去的是 official 名的 dev jar,线上加载直接崩。finalizer 不构成消费方的依赖边,这里补上。
tasks.matching { it.name == 'jarJar' }.configureEach {
    dependsOn ':api:forge:reobfJar'
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}

// ForgeGradle quirk: classes + resources share one output dir so the dev launcher and the
// mixin refmap see them together.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}





// Forge 49 起 dev 启动为 GAME 模块层做 JPMS 校验:ai/ui 兄弟 jar 若上了运行
// classpath,会以自动模块身份与聚合进 numen_api 模组模块(runs 的 mods 块)的
// 同名包冲突,直接拒启。从运行用的 runtimeClasspath 里排除这两个工件——
// 它们的类经 MOD_CLASSES(源码集输出)进运行,一个不少;编译、打包不受影响。
configurations.named('runtimeClasspath') {
    exclude module: 'ai'
    exclude module: 'ui'
}



// mixin AP 与增量编译不相容：增量轮次 AP 不重跑，refmap 丢失且 jar 静默不带，
// 生产环境 SRG 运行时 mixin 按官方名找不到目标直接拒启（开发期 disableRefMap 照不出）。
tasks.named("compileJava", JavaCompile) { options.incremental = false }
// 绞索：包里有 mixins.json 就必须有 refmap，缺了当场把构建判死，不给静默坏包出门。
tasks.named("jar", Jar) {
    doLast {
        def zf = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            boolean hasMixins = zf.entries().any { it.name.endsWith(".mixins.json") }
            boolean hasRefmap = zf.entries().any { it.name.endsWith(".refmap.json") }
            if (hasMixins && !hasRefmap) {
                throw new GradleException("mixin refmap missing from ${archiveFile.get().asFile.name}")
            }
        } finally { zf.close() }
    }
}

// 联动模组的类与资源平铺进发行 jar——它们本质是独立模组,只是跟车一起发。
// 目标模组不在时它们一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
//
// jar 和 jarJar 都要:Forge 这边真正发出去的是 jarJar 产的 -all(它把引擎嵌进
// META-INF/jarjar/),而它<b>不继承 jar 的内容配置</b>。只加在 jar 上的话,-all 里
// 一个联动 class 都没有——装上去就是"工具凭空少了几个",还不报错。
tasks.matching { it.name == 'jar' || it.name == 'jarJar' }.configureEach {
    it.from({ project(':plugins:ysm').sourceSets.main.output })
    it.from({ project(':plugins:curios').sourceSets.main.output })
}

// 联动经目标模组的类型调用原版方法:reobf 要知道那些类型的继承关系,才能把调用点的方法名翻成 SRG 名,认不出来的调用点留着官方名、
// 线上就是 NoSuchMethodError。所以把各联动的编译期类路径(目标模组的 jar 在里面)一并交给 reobf 当库。
tasks.matching { it.name == 'reobfJar' || it.name == 'reobfJarJar' }.configureEach {
    libraries.from({
        [':plugins:curios'].collect {
            project(it).configurations.compileClasspath
        }
    })
}
