plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Obfuscated MC (1.20.1) → loom remaps to Mojang names to match the common source set.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // The numen-api engine, now a sibling loom project in this build. namedElements
    // exposes the dev-mappings jar directly — no remap round-trip through a maven repo.
    // api 而非 implementation:引擎的类型出现在 core 的公开签名里
    // (AbstractCompanionTask<R extends TaskRecord> 等),消费者编译期必须看得见;
    // implementation 在 POM 里落成 runtime,想扩展 core 的人拿得到 jar 却编译不了。
    // 本模块的 datagen 需要引擎在运行时类路径上,所以是 api 而不是 compileOnlyApi
    // ——Forge 那边相反,见 core/forge/build.gradle。
    api project(path: ':api:fabric', configuration: 'namedElements')
    // Bundle it into core's jar (Jar-in-Jar) so players install one file and get
    // both mods — exactly like including a library mod such as GeckoLib.
    include project(':api:fabric')

    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar,不作为独立依赖出现在 POM 里。
    // 只有 YSM:车万女仆没有 Fabric 版。
    compileOnly project(':plugins:ysm')
}

loom {
    mixin {
        // mixins.json 声明的 refmap 名是 ${mod_id}.refmap.json,loom 默认按归档名生成
        // ${mod_id}-fabric-1.20.1-refmap.json,运行期按声明的名字读不到,这里显式对齐。
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    def aw = project(':core:common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        datagen {
            inherit client
            setConfigName('Fabric Data Generation')
            ideConfigGenerated(true)
            runDir('runs/datagen')
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 联动模组的类与资源平铺进发行 jar——它本质是独立模组,只是跟车一起发。
// 平铺在 jar 这一步,随后 remapJar 把它连同本模块的类一起换成 intermediary 名:
// 联动对着原版的 Mojang 名编译,与本模块的 named 命名空间是同一套,所以能一起重映射。
// 目标模组不在时它一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
tasks.named('jar', Jar) {
    from({ project(':plugins:ysm').sourceSets.main.output })
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    // loom 1.6 没有的配置名(如 includeInternal)直接跳过——matching 不触发未知名报错
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
