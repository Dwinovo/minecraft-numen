plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Obfuscated MC (1.20.2) → loom remaps to Mojang names to match the common source set.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // The numen-api engine, now a sibling loom project in this build. namedElements
    // exposes the dev-mappings jar directly — no remap round-trip through a maven repo.
    // api 而非 implementation/compileOnly:引擎的类型出现在 core 的公开签名里
    // (例如 AbstractCompanionTask<R extends TaskRecord>,TaskRecord 来自引擎)。
    // 记成 runtime 或干脆不进 POM,想扩展 core 的开发者编译期就看不见
    // TaskRecord/Task/NumenPlayer,依赖 core 这条路直接走不通。
    api project(path: ':api:fabric', configuration: 'namedElements')
    // Bundle it into core's jar (Jar-in-Jar) so players install one file and get
    // both mods — exactly like including a library mod such as GeckoLib.
    include project(':api:fabric')
}

loom {
    mixin {
        // mixins.json 声明的 refmap 名是 ${mod_id}.refmap.json,loom 默认按归档名生成
        // ${mod_id}-fabric-1.20.2-refmap.json,运行期按声明的名字读不到,这里显式对齐。
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    def aw = project(':core:common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        datagen {
            inherit client
            setConfigName('Fabric Data Generation')
            ideConfigGenerated(true)
            runDir('runs/datagen')
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    // loom 1.6 没有的配置名(如 includeInternal)直接跳过——matching 不触发未知名报错
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
