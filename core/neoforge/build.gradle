plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    // The numen-api engine, now a sibling moddev project in this build.
    // NeoForge is Mojang-mapped natively, so no remap step is needed.
    // api 而非 implementation:引擎的类型出现在 core 的公开签名里
    // (AbstractCompanionTask<R extends TaskRecord> 等),消费者编译期必须看得见;
    // implementation 在 POM 里落成 runtime,想扩展 core 的人拿得到 jar 却编译不了。
    // 本模块的 datagen 需要引擎在运行时类路径上,所以是 api 而不是 compileOnlyApi
    // ——Forge 那边相反,见 core/forge/build.gradle。
    api project(':api:neoforge')

    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它们的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar,不作为独立依赖出现在 POM 里
    // (它们不发布——没人需要依赖我们的联动代码)。
    compileOnly project(':plugins:ysm')
    compileOnly project(':plugins:tlm')
    // Bundle it into core's jar (Jar-in-Jar) so players install one file and get both mods.
    jarJar(project(':api:neoforge'))
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':core:common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            // 所有运行配置都指向仓库内的 SNBT 模板目录:无头跑批用,开发客户端里
            // /test run <用例> 现场围观也用(见 CompanionGameTests 静态块)。
            systemProperty('numen.gametest.structures', file('gameteststructures').absolutePath)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            clientData() // MDG on NeoForge 1.21.4+ split the data run; clientData + --all still emits our providers
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = this.mkdir(this.file("runs/gametestserver"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

// 联动模组的类与资源平铺进发行 jar——它们本质是独立模组,只是跟车一起发。
// 目标模组不在时它们一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
tasks.named('jar', Jar) {
    from({ project(':plugins:ysm').sourceSets.main.output })
    from({ project(':plugins:tlm').sourceSets.main.output })
}
